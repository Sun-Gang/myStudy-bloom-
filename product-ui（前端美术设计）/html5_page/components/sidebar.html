<body class="text-on-surface">
  <!-- 侧边栏导航 -->

    </div>
    <nav class="flex-1 flex flex-col gap-2 px-2" id="sidebar-nav">
      <a class="nav-link flex items-center gap-4 text-[#514345] px-6 py-3 mx-2 hover:bg-[#f8e3ea] rounded-full transition-all"
        href="pages/home.html" data-page="home.html" target="_top">

      </a>
      <a class="nav-link flex items-center gap-4 text-[#514345] px-6 py-3 mx-2 hover:bg-[#f8e3ea] rounded-full transition-all"
        href="pages/accounts.html" data-page="accounts.html" target="_top">

      </a>

        <span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;">receipt_long</span>

      </a>
      <a class="nav-link flex items-center gap-4 text-[#514345] px-6 py-3 mx-2 hover:bg-[#f8e3ea] rounded-full transition-all"

    <div class="px-4 mt-auto">
      <button id="logout-btn" class="w-full flex items-center gap-4 text-[#514345] px-6 py-3 mt-4 hover:bg-[#f8e3ea] rounded-full transition-all cursor-pointer">
        <span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;">logout</span>
        <span class="text-[16px] leading-[24px]">退出登录</span>
      </button>
    </div>
  </aside>

  <script>
    var isInIframe = window.self !== window.top;
    var basePath = isInIframe ? '../' : '';

    function updateActiveNav() {
      var hash = isInIframe ? window.top.location.hash : window.location.hash;
      var currentPage = hash.replace('#', '') || 'home.html';
      console.log('updateActiveNav called, isInIframe:', isInIframe, 'hash:', hash, 'currentPage:', currentPage);
      document.querySelectorAll('.nav-link').forEach(function(link) {
        if (link.getAttribute('data-page') === currentPage) {
          link.classList.add('bg-[#f8e3ea]');
        } else {
          link.classList.remove('bg-[#f8e3ea]');
        }
      });
    }

    document.getElementById('logout-btn').addEventListener('click', function() {
      localStorage.removeItem('access_token');
      localStorage.removeItem('refresh_token');
      window.top.location.href = basePath + 'pages/auth/login.html';
    });

    document.querySelectorAll('.nav-link').forEach(function(link) {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var page = this.getAttribute('data-page');
        if (isInIframe) {
          window.top.location.hash = page;
        } else {
          window.location.hash = page;
        }
      });
    });

    // Listen for hash changes on the top window (for iframe context)
    if (isInIframe) {
      window.top.addEventListener('hashchange', updateActiveNav);
    } else {
      window.addEventListener('hashchange', updateActiveNav);
    }

    // Initial highlight based on current hash
    updateActiveNav();
  </script>
