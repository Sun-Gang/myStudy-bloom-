<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>顶部导航栏</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    html, body { background: transparent; margin: 0; padding: 0; font-family: sans-serif; overflow: visible; height: 100%; }
    .hdr { display:flex; justify-content:space-between; align-items:center; width:100%; height:72px; padding:8px 24px; background:rgba(255,248,248,0.95); box-sizing:border-box; position: relative; z-index: 9999; overflow: visible; }
    .icon { font-family: 'Material Symbols Outlined'; font-size: 24px; color: #864e5a; cursor: pointer; padding: 10px; border-radius: 50%; background: rgba(255,183,197,0.3); border: none; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
    .icon:hover { background: rgba(255,183,197,0.6); }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .panel { display: none; position: absolute; right: 0; top: 100%; width: 320px; background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); border: 2px solid #f8e3ea; z-index: 99999; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 99999; display: none; align-items: center; justify-content: center; }
    .modal-box { background: white; border-radius: 20px; width: 90%; max-width: 500px; max-height: 90vh; overflow: auto; margin: auto; position: relative; top: auto; left: auto; transform: none; }
    .modal-hd { padding: 16px 20px; border-bottom: 2px solid #f8e3ea; display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 18px; font-weight: 700; color: #24181d; margin: 0; }
    .badge { position: absolute; top: 2px; right: 2px; background: red; color: white; font-size: 10px; min-width: 18px; height: 18px; border-radius: 9px; display: none; align-items: center; justify-content: center; padding: 0 4px; box-sizing: border-box; }
    .btn-x { background: none; border: none; cursor: pointer; font-size: 24px; color: #514345; padding: 8px; border-radius: 50%; }
    .btn-x:hover { background: rgba(255,183,197,0.3); }
  </style>
</head>
<body>
  <div class="hdr">
    <div>
      <div style="font-size:28px; font-weight:700; color:#864e5a;">你好，Sunny！</div>
      <div style="font-size:14px; color:#514345; margin-top:2px;">让我们一起实现你的财富梦想。</div>
    </div>
    <div style="display:flex; gap:8px; align-items:center; position:relative;">
      <div style="position:relative;">
        <button id="notifBtn" class="icon material-symbols-outlined">notifications<span id="notifBadge" class="badge">0</span></button>
        <div id="notifPanel" class="panel">
          <div style="padding:12px 16px; border-bottom:1px solid #f8e3ea; display:flex; justify-content:space-between;">
            <span style="font-weight:700; font-size:14px; color:#24181d;">通知中心</span>
            <span id="markAllBtn" style="font-size:12px; color:#864e5a; cursor:pointer;">全部已读</span>
          </div>
          <div id="notifList" style="max-height:300px; overflow:auto;">
            <div style="padding:20px; text-align:center; color:#514345; font-size:14px;">暂无通知</div>
          </div>
        </div>
      </div>
      <button id="settingsBtn" class="icon material-symbols-outlined">settings</button>
      <div style="position:relative;">
        <button id="avatarBtn" class="icon material-symbols-outlined" style="width:44px; height:44px; padding:0; border-radius:50%; border:2px solid #ffb7c5; background:#ffb7c5; color:#864e5a; font-weight:700; font-size:18px; line-height:44px; text-align:center;">account_circle<span id="avatarInitial" style="display:none;">S</span></button>
        <div id="userPanel" class="panel" style="width:220px;">
          <div style="padding:16px; border-bottom:1px solid #f8e3ea;">
            <div style="font-weight:700; font-size:14px; color:#24181d;">Sunny</div>
            <div style="font-size:12px; color:#514345; margin-top:2px;">sungang521210@163.com</div>
          </div>
          <div id="profileMenuBtn" style="padding:12px 16px; cursor:pointer; display:flex; align-items:center; gap:12px;">
            <span class="material-symbols-outlined" style="font-size:20px;">person</span>
            <span style="font-size:14px; color:#24181d;">个人资料</span>
          </div>
          <div id="settingsMenuBtn" style="padding:12px 16px; cursor:pointer; display:flex; align-items:center; gap:12px;">
            <span class="material-symbols-outlined" style="font-size:20px;">settings</span>
            <span style="font-size:14px; color:#24181d;">设置</span>
          </div>
          <div id="logoutMenuBtn" style="padding:12px 16px; cursor:pointer; display:flex; align-items:center; gap:12px; border-top:1px solid #f8e3ea;">
            <span class="material-symbols-outlined" style="font-size:20px; color:#ba1a1a;">logout</span>
            <span style="font-size:14px; color:#ba1a1a;">退出登录</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal">
    <div class="modal-box">
      <div class="modal-hd">
        <h3 class="modal-title">设置</h3>
        <button class="btn-x material-symbols-outlined" id="closeSettingsBtn" style="font-size:20px;">close</button>
      </div>
      <div style="padding:24px 28px;">
        <div style="padding:16px; background:#fff0f4; border-radius:12px; margin-bottom:16px;">
          <div style="font-weight:700; font-size:14px; color:#24181d; margin-bottom:12px;">通知设置</div>
          <div style="display:flex; flex-direction:column; gap:10px;">
            <label style="display:flex; justify-content:space-between; cursor:pointer;">
              <span style="font-size:14px;">账单到期提醒</span>
              <input type="checkbox" checked>
            </label>
            <label style="display:flex; justify-content:space-between; cursor:pointer;">
              <span style="font-size:14px;">逾期预警</span>
              <input type="checkbox" checked>
            </label>
            <label style="display:flex; justify-content:space-between; cursor:pointer;">
              <span style="font-size:14px;">大额收支提醒</span>
              <input type="checkbox">
            </label>
          </div>
        </div>
        <div style="padding:16px; background:#fff0f4; border-radius:12px; margin-bottom:16px;">
          <div style="font-weight:700; font-size:14px; color:#24181d;">分类管理</div>
          <div style="padding:12px; background:white; border-radius:8px; margin-top:8px; cursor:pointer;">
            <span style="font-size:14px;">收入/支出分类</span>
          </div>
        </div>
        <div style="padding:16px; background:#fff0f4; border-radius:12px;">
          <div style="font-weight:700; font-size:14px; color:#24181d;">关于</div>
          <div style="padding:12px; background:white; border-radius:8px; margin-top:8px;">
            <span style="font-size:14px;">Bloom 财务 v1.0.0</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="profileModal" class="modal">
    <div class="modal-box" style="max-width:400px;">
      <div class="modal-hd">
        <h3 class="modal-title">个人资料</h3>
        <button class="btn-x material-symbols-outlined" id="closeProfileBtn" style="font-size:20px;">close</button>
      </div>
      <div style="padding:24px; text-align:center;">
        <div style="width:80px; height:80px; border-radius:50%; border:4px solid #ffb7c5; margin:0 auto 12px; background:#ffb7c5; display:flex; align-items:center; justify-content:center; font-size:32px; color:#864e5a; font-weight:700; box-sizing:border-box;">S</div>
        <div style="padding:12px; background:#fff0f4; border-radius:8px; margin-bottom:12px; text-align:left;">
          <div style="font-size:12px; color:#514345;">用户名</div>
          <div style="font-size:14px; color:#24181d;">Sunny</div>
        </div>
        <div style="padding:12px; background:#fff0f4; border-radius:8px; margin-bottom:12px; text-align:left;">
          <div style="font-size:12px; color:#514345;">邮箱</div>
          <div style="font-size:14px; color:#24181d;">sungang521210@163.com</div>
        </div>
        <div style="padding:12px; background:#fff0f4; border-radius:8px; text-align:left;">
          <div style="font-size:12px; color:#514345;">手机号</div>
          <div style="font-size:14px; color:#24181d;">138****0120</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var N = document.getElementById('notifBtn');
    var NP = document.getElementById('notifPanel');
    var NB = document.getElementById('notifBadge');
    var NL = document.getElementById('notifList');
    var SB = document.getElementById('settingsBtn');
    var SM = document.getElementById('settingsModal');
    var CSB = document.getElementById('closeSettingsBtn');
    var AB = document.getElementById('avatarBtn');
    var UP = document.getElementById('userPanel');
    var PMB = document.getElementById('profileMenuBtn');
    var SMB = document.getElementById('settingsMenuBtn');
    var LMB = document.getElementById('logoutMenuBtn');
    var PRM = document.getElementById('profileModal');
    var CPB = document.getElementById('closeProfileBtn');
    var MAB = document.getElementById('markAllBtn');

    function hide() {
      NP.style.display = 'none';
      UP.style.display = 'none';
      SM.style.display = 'none';
      PRM.style.display = 'none';
      var clones = window.top.document.querySelectorAll('[id$="-cloned"]');
      clones.forEach(function(c) { c.remove(); });
    }

    N.onclick = function(e) {
      e.stopPropagation();
      hide();
      var existingClone = document.getElementById('notifPanel-cloned');
      if (existingClone) existingClone.remove();

      var panel = NP.cloneNode(true);
      panel.id = 'notifPanel-cloned';
      panel.style.display = 'block';
      panel.style.position = 'fixed';
      panel.style.left = '50%';
      panel.style.top = '100px';
      panel.style.transform = 'translateX(-50%)';
      panel.style.zIndex = 99999;
      panel.style.width = '320px';
      panel.style.background = 'white';
      panel.style.borderRadius = '16px';
      panel.style.boxShadow = '0 10px 40px rgba(0,0,0,0.2)';
      panel.style.border = '2px solid #f8e3ea';
      var closeBtn = document.createElement('div');
      closeBtn.innerHTML = '&#10005;';
      closeBtn.style.cssText = 'position:absolute;top:8px;right:8px;font-size:18px;cursor:pointer;color:#514345;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,183,197,0.5);z-index:1;';
      closeBtn.innerHTML = 'close';
      closeBtn.className = 'material-symbols-outlined';
      closeBtn.onclick = function(e) { e.stopPropagation(); panel.remove(); };
      panel.appendChild(closeBtn);
      var firstDiv = panel.querySelector('div');
      if (firstDiv) {
        firstDiv.style.marginTop = '32px';
      }
      panel.style.paddingTop = '0';
      window.top.document.body.appendChild(panel);
      panel.onclick = function(e) { e.stopPropagation(); };
      loadNotifsForClone(panel);
    };

    SB.onclick = function(e) {
      e.stopPropagation();
      hide();
      var existingClone = window.top.document.getElementById('settingsModal-cloned');
      if (existingClone) existingClone.remove();

      var modal = SM.cloneNode(true);
      modal.id = 'settingsModal-cloned';
      modal.style.display = 'flex';
      modal.style.position = 'fixed';
      modal.style.top = '0';
      modal.style.left = '0';
      modal.style.width = '100%';
      modal.style.height = '100%';
      modal.style.background = 'rgba(0,0,0,0.6)';
      modal.style.zIndex = 99999;
      modal.style.alignItems = 'center';
      modal.style.justifyContent = 'center';
      var modalBox = modal.querySelector('.modal-box');
      if (modalBox) {
        modalBox.style.position = 'relative';
        modalBox.style.margin = 'auto';
        modalBox.style.top = 'auto';
        modalBox.style.left = 'auto';
        modalBox.style.transform = 'none';
        modalBox.style.maxWidth = '500px';
        modalBox.style.width = '90%';
      }
      var closeBtn = modal.querySelector('#closeSettingsBtn');
      if (closeBtn) {
        closeBtn.onclick = function() { modal.remove(); };
      }
      window.top.document.body.appendChild(modal);
      modal.onclick = function(e) { if (e.target === modal) modal.remove(); };
      loadPrefsForClone(modal);
    };

    AB.onclick = function(e) {
      e.stopPropagation();
      hide();
      var existingClone = document.getElementById('userPanel-cloned');
      if (existingClone) existingClone.remove();

      var panel = UP.cloneNode(true);
      panel.id = 'userPanel-cloned';
      panel.style.display = 'block';
      panel.style.position = 'fixed';
      panel.style.right = '24px';
      panel.style.top = '100px';
      panel.style.zIndex = 99999;
      panel.style.width = '220px';
      panel.style.background = 'white';
      panel.style.borderRadius = '16px';
      panel.style.boxShadow = '0 10px 40px rgba(0,0,0,0.2)';
      panel.style.border = '2px solid #f8e3ea';
      var closeBtn = document.createElement('div');
      closeBtn.innerHTML = '&#10005;';
      closeBtn.style.cssText = 'position:absolute;top:8px;right:8px;font-size:18px;cursor:pointer;color:#514345;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,183,197,0.5);z-index:1;';
      closeBtn.innerHTML = 'close';
      closeBtn.className = 'material-symbols-outlined';
      closeBtn.onclick = function(e) { e.stopPropagation(); panel.remove(); };
      panel.appendChild(closeBtn);
      var firstDiv = panel.querySelector('div');
      if (firstDiv) {
        firstDiv.style.marginTop = '32px';
      }
      panel.style.paddingTop = '0';
      window.top.document.body.appendChild(panel);
      panel.onclick = function(e) { e.stopPropagation(); };

      var profileBtn = panel.querySelector('#profileMenuBtn');
      if (profileBtn) {
        profileBtn.onclick = function() {
          panel.remove();
          showProfileModal();
        };
      }
      var settingsBtn = panel.querySelector('#settingsMenuBtn');
      if (settingsBtn) {
        settingsBtn.onclick = function() {
          panel.remove();
          var evt = { stopPropagation: function() {} };
          SB.onclick(evt);
        };
      }
      var logoutBtn = panel.querySelector('#logoutMenuBtn');
      if (logoutBtn) {
        logoutBtn.onclick = function() {
          localStorage.removeItem('access_token');
          localStorage.removeItem('refresh_token');
          window.top.location.href = '../pages/auth/login.html';
        };
      }
    };

    function showProfileModal() {
      hide();
      var existingClone = window.top.document.getElementById('profileModal-cloned');
      if (existingClone) existingClone.remove();

      var modal = PRM.cloneNode(true);
      modal.id = 'profileModal-cloned';
      modal.style.display = 'flex';
      modal.style.position = 'fixed';
      modal.style.top = '0';
      modal.style.left = '0';
      modal.style.width = '100%';
      modal.style.height = '100%';
      modal.style.background = 'rgba(0,0,0,0.6)';
      modal.style.zIndex = 99999;
      modal.style.alignItems = 'center';
      modal.style.justifyContent = 'center';
      var modalBox = modal.querySelector('.modal-box');
      if (modalBox) {
        modalBox.style.position = 'relative';
        modalBox.style.margin = 'auto';
        modalBox.style.top = 'auto';
        modalBox.style.left = 'auto';
        modalBox.style.transform = 'none';
      }
      var closeBtn = modal.querySelector('#closeProfileBtn');
      if (closeBtn) {
        closeBtn.onclick = function() { modal.remove(); };
      }
      window.top.document.body.appendChild(modal);
      modal.onclick = function(e) { if (e.target === modal) modal.remove(); };
    };

    CSB.onclick = function() { SM.style.display = 'none'; };
    CPB.onclick = function() { PRM.style.display = 'none'; };

    PMB.onclick = function() { hide(); PRM.style.display = 'flex'; };
    SMB.onclick = function() { hide(); SM.style.display = 'flex'; };

    LMB.onclick = function() {
      localStorage.removeItem('access_token');
      localStorage.removeItem('refresh_token');
      window.top.location.href = '../pages/auth/login.html';
    };

    MAB.onclick = function(e) {
      e.stopPropagation();
      var t = localStorage.getItem('access_token');
      if (!t) return;
      fetch('http://localhost:8080/api/v1/notifications/read-all', {
        method: 'PUT',
        headers: { 'Authorization': 'Bearer ' + t }
      }).then(function() {
        NB.style.display = 'none';
        var clones = window.top.document.querySelectorAll('[id$="-cloned"]');
        clones.forEach(function(c) { c.remove(); });
        loadUnread();
      }).catch(function() {});
    };

    document.onclick = function(e) {
      if (!N.contains(e.target) && !NP.contains(e.target) && !document.getElementById('notifPanel-cloned')?.contains(e.target)) {
        var clone = document.getElementById('notifPanel-cloned');
        if (clone) clone.remove();
      }
      if (!AB.contains(e.target) && !UP.contains(e.target) && !document.getElementById('userPanel-cloned')?.contains(e.target)) {
        var clone = document.getElementById('userPanel-cloned');
        if (clone) clone.remove();
      }
    };

    document.onkeydown = function(e) {
      if (e.key === 'Escape') {
        hide();
      }
    };

    function loadNotifs() {
      var t = localStorage.getItem('access_token');
      if (!t) return;
      fetch('http://localhost:8080/api/v1/notifications?page=1&size=5', {
        headers: { 'Authorization': 'Bearer ' + t }
      }).then(function(r) { return r.json(); }).then(function(d) {
        if (d.code === 200 && d.data && d.data.records && d.data.records.length > 0) {
          var h = '';
          for (var i = 0; i < d.data.records.length; i++) {
            var n = d.data.records[i];
            h += '<div style="padding:12px; border-bottom:1px solid #fff0f4; cursor:pointer;" onclick="mr(' + n.id + ')">' +
              '<div style="font-size:14px; font-weight:500; color:#24181d;">' + (n.title || '通知') + '</div>' +
              '<div style="font-size:12px; color:#514345; margin-top:4px;">' + (n.content || '') + '</div></div>';
          }
          NL.innerHTML = h;
        }
      }).catch(function() {});
    }

    function loadNotifsForClone(clonePanel) {
      var t = localStorage.getItem('access_token');
      if (!t) return;
      fetch('http://localhost:8080/api/v1/notifications?page=1&size=5', {
        headers: { 'Authorization': 'Bearer ' + t }
      }).then(function(r) { return r.json(); }).then(function(d) {
        var notifList = clonePanel.querySelector('#notifList') || clonePanel.querySelector('[id="notifList"]');
        if (!notifList) return;
        if (d.code === 200 && d.data && d.data.records && d.data.records.length > 0) {
          var h = '';
          for (var i = 0; i < d.data.records.length; i++) {
            var n = d.data.records[i];
            h += '<div style="padding:12px; border-bottom:1px solid #fff0f4; cursor:pointer;" onclick="mrClone(\'' + n.id + '\', \'' + t + '\')">' +
              '<div style="font-size:14px; font-weight:500; color:#24181d;">' + (n.title || '通知') + '</div>' +
              '<div style="font-size:12px; color:#514345; margin-top:4px;">' + (n.content || '') + '</div></div>';
          }
          notifList.innerHTML = h;
        } else {
          notifList.innerHTML = '<div style="padding:20px; text-align:center; color:#514345; font-size:14px;">暂无通知</div>';
        }
      }).catch(function() {});
    }

    window.mrClone = function(id, token) {
      fetch('http://localhost:8080/api/v1/notifications/' + id + '/read', {
        method: 'PUT',
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(function() {
        var clones = window.top.document.querySelectorAll('[id$="-cloned"]');
        clones.forEach(function(c) { c.remove(); });
        loadUnread();
      }).catch(function() {});
    };

    function loadPrefsForClone(cloneModal) {
      var t = localStorage.getItem('access_token');
      if (!t) return;
      fetch('http://localhost:8080/api/v1/notifications/prefs', {
        headers: { 'Authorization': 'Bearer ' + t }
      }).then(function(r) { return r.json(); }).then(function(d) {
        console.log('Prefs response:', d);
        console.log('Prefs data:', d.data);
        var checkboxes = cloneModal.querySelectorAll('input[type="checkbox"]');
        console.log('Checkboxes found:', checkboxes.length);
        if (d.code === 200 && d.data) {
          console.log('Setting checkbox values:', d.data);
          if (d.data.billDueEnabled !== undefined) {
            console.log('Setting checkbox 0 to:', d.data.billDueEnabled);
            checkboxes[0].checked = d.data.billDueEnabled;
          }
          if (d.data.overdueWarningEnabled !== undefined) {
            console.log('Setting checkbox 1 to:', d.data.overdueWarningEnabled);
            checkboxes[1].checked = d.data.overdueWarningEnabled;
          }
          if (d.data.largeTxEnabled !== undefined) {
            console.log('Setting checkbox 2 to:', d.data.largeTxEnabled);
            checkboxes[2].checked = d.data.largeTxEnabled;
          }
        }
      }).catch(function(e) { console.log('Prefs error:', e); });

      var checkboxes = cloneModal.querySelectorAll('input[type="checkbox"]');
      console.log('Setting up checkbox listeners, found:', checkboxes.length);
      checkboxes.forEach(function(cb, index) {
        console.log('Setting up listener for checkbox', index);
        cb.onchange = function() {
          console.log('Checkbox', index, 'changed to', cb.checked);
          updatePrefs(cloneModal, t);
        };
      });
    }

    function updatePrefs(cloneModal, token) {
      var checkboxes = cloneModal.querySelectorAll('input[type="checkbox"]');
      var prefs = {
        billDueEnabled: checkboxes[0].checked,
        overdueWarningEnabled: checkboxes[1].checked,
        largeTxEnabled: checkboxes[2].checked
      };
      console.log('Updating prefs:', prefs);
      fetch('http://localhost:8080/api/v1/notifications/prefs', {
        method: 'PUT',
        headers: {
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(prefs)
      }).then(function(r) { return r.json(); }).then(function(d) {
        console.log('Prefs updated response:', d);
        if (d.code === 200) {
          // Reload prefs after update
          loadPrefsForClone(cloneModal);
        }
      }).catch(function(e) { console.log('Update prefs error:', e); });
    }

    function loadUnread() {
      var t = localStorage.getItem('access_token');
      if (!t) return;
      fetch('http://localhost:8080/api/v1/notifications/unread-count', {
        headers: { 'Authorization': 'Bearer ' + t }
      }).then(function(r) { return r.json(); }).then(function(d) {
        if (d.code === 200 && d.data && d.data.unreadCount > 0) {
          NB.textContent = d.data.unreadCount > 99 ? '99+' : d.data.unreadCount;
          NB.style.display = 'flex';
        } else {
          NB.style.display = 'none';
        }
      }).catch(function() {});
    }

    loadUnread();

    window.toggleSettings = function() {
      hide();
      SM.style.display = 'flex';
    };

    window.toggleUser = function() {
      hide();
      UP.style.display = 'block';
    };
