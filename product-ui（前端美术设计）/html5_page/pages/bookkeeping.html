<html lang="zh-CN">

<head>
  <meta charset="utf-8">

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    tailwind.config = {

            "inverse-surface": "#3a2d32",
            "on-tertiary-container": "#256036",
            "on-secondary-fixed-variant": "#4b4822",
            "outline-variant": "#d6c2c4",
            "error-container": "#ffdad6",
            "secondary": "#636037",
            "on-secondary-fixed": "#1e1c00",
            "surface-container-low": "#fff0f4",
            "surface-container-highest": "#f2dde4",
            "surface-container-high": "#f8e3ea",
            "on-surface": "#24181d",
            "secondary-fixed": "#eae4b1",
            "on-error-container": "#93000a",
            "on-tertiary-fixed": "#00210b",
            "primary-fixed-dim": "#fbb3c1",
            "on-primary": "#ffffff",
            "background": "#fff8f8",
            "surface-container": "#fee8f0",
            "primary-fixed": "#ffd9df",
            "surface-tint": "#864e5a",
            "surface": "#fff8f8",
            "error": "#ba1a1a",
            "tertiary-fixed": "#b2f2bb",
            "on-background": "#24181d",
            "on-secondary-container": "#67643b",
            "surface-container-lowest": "#ffffff",
            "on-primary-container": "#7b4551",
            "on-error": "#ffffff",
            "tertiary": "#2f6a3f",
            "on-primary-fixed": "#360c19",
            "outline": "#837375",
            "surface-bright": "#fff8f8",
            "primary": "#864e5a",
            "surface-variant": "#f2dde4",
            "on-secondary": "#ffffff",
            "on-surface-variant": "#514345",
            "inverse-primary": "#fbb3c1",
            "on-primary-fixed-variant": "#6b3743",
            "secondary-fixed-dim": "#cdc897",
            "tertiary-container": "#9ad9a4",
            "on-tertiary-fixed-variant": "#145129",

          "spacing": {

            "margin-mobile": "16px",

          "fontFamily": {

      font-family: 'Be Vietnam Pro', sans-serif;

      box-shadow: 0 20px 40px rgba(240, 208, 216, 0.4);

</head>

<body class="bg-background text-on-surface font-body-md min-h-screen flex">
  <!-- Sidebar Navigation (iframe) -->
  <iframe id="sidebar-iframe" src="../components/sidebar.html" class="fixed left-0 top-0 h-screen w-[288px] z-40" frameborder="0" scrolling="no"></iframe>

  <!-- Main Content Area -->
  <main class="flex-1 md:ml-[288px] mb-20 md:mb-0">
    <!-- Header (iframe) -->
    <iframe id="header-iframe" src="../components/header.html" class="sticky top-0 z-40 w-full h-[72px]" frameborder="0" scrolling="no"></iframe>

    <div class="p-container-padding max-w-container-max mx-auto space-y-8 pb-12">
      <!-- Loading State -->
      <div id="loading-state" class="flex items-center justify-center h-64">
        <div class="text-on-surface-variant">加载中...</div>
      </div>

      <!-- Summary Dashboard (Bento Style) - Hidden by default -->
      <section id="summary-section" class="grid grid-cols-1 md:grid-cols-3 gap-gutter hidden">
        <div id="monthly-summary-card" class="col-span-1 md:col-span-2 bg-white p-6 rounded-2xl soft-glow border border-white flex flex-col justify-between min-h-[160px]">
          <div class="flex justify-between items-start">
            <div>
              <p class="text-sm text-on-surface-variant font-medium">月度支出摘要</p>

            </div>
            <span id="budget-status" class="bg-tertiary-container/30 text-on-tertiary-container px-3 py-1 rounded-full text-xs font-bold">进度正常</span>
          </div>
          <div class="grid grid-cols-2 gap-4 mt-6">
            <div>
              <p class="text-sm text-on-surface-variant">总支出</p>
              <p id="monthly-expense" class="text-xl font-bold font-label-data text-data-outflow">-¥0.00</p>
            </div>
            <div>
              <p class="text-sm text-on-surface-variant">日均支出</p>
              <p id="daily-average" class="text-xl font-bold font-label-data text-on-surface">¥0.00</p>
            </div>
          </div>
        </div>
        <div id="reimbursable-card" class="bg-primary-container p-6 rounded-2xl soft-glow border border-primary-container text-on-primary-container flex flex-col justify-center">
          <div class="flex items-center gap-2 mb-2">
            <span class="material-symbols-outlined">savings</span>
            <p class="text-sm font-medium">待报销金额</p>
          </div>
          <p id="reimbursable-amount" class="text-3xl font-bold font-label-data">¥0.00</p>
          <button id="view-reimbursable-btn" class="mt-4 text-xs font-bold flex items-center gap-1 hover:underline cursor-pointer">
            查看<span id="reimbursable-count">0</span>项流水 <span class="material-symbols-outlined text-[14px]">arrow_forward</span>
          </button>
        </div>
      </section>

      <!-- Search and Filter Bar - Hidden by default -->
      <section id="filter-section" class="bg-white p-4 rounded-2xl soft-glow border border-white flex flex-col md:flex-row gap-4 items-center hidden">
        <div class="relative flex-1 w-full">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
          <input id="search-input" class="w-full pl-10 pr-4 py-2 bg-surface-container-low border border-outline-variant rounded-full focus:ring-2 focus:ring-primary focus:border-primary outline-none text-body-md" placeholder="搜索商家、备注或金额..." type="text">
        </div>
        <div class="flex gap-2 w-full md:w-auto">
          <button id="filter-date-btn" class="flex-1 md:flex-none flex items-center justify-center gap-2 px-4 py-2 bg-white border border-outline-variant rounded-full hover:bg-surface-container transition-colors text-body-md cursor-pointer">
            <span class="material-symbols-outlined text-[20px]">calendar_month</span>日期
          </button>
          <button id="filter-category-btn" class="flex-1 md:flex-none flex items-center justify-center gap-2 px-4 py-2 bg-white border border-outline-variant rounded-full hover:bg-surface-container transition-colors text-body-md cursor-pointer">
            <span class="material-symbols-outlined text-[20px]">filter_list</span>分类
          </button>
        </div>
      </section>

      <!-- Transaction List - Hidden by default -->
      <section id="transaction-section" class="space-y-6 hidden">
        <div id="transaction-list"></div>
      </section>

      <!-- Empty State - Hidden by default -->
      <div id="empty-state" class="text-center py-12 hidden">
        <span class="material-symbols-outlined text-[64px] text-on-surface-variant">receipt_long</span>
        <p class="text-on-surface-variant mt-4">暂无交易记录</p>
        <button id="add-first-transaction-btn" class="mt-4 px-6 py-2 bg-primary text-white rounded-xl cursor-pointer">添加第一笔交易</button>
      </div>

  </main>

  <!-- Bottom Nav Bar (Mobile Only) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-background/80 backdrop-blur-xl md:hidden flex justify-around items-center py-4 px-4 z-50 border-t border-outline-variant/30">
    <a class="flex flex-col items-center gap-1 text-on-surface-variant" href="home.html">
      <span class="material-symbols-outlined">grid_view</span>
      <span class="font-label-sm">首页</span>
    </a>
    <a class="flex flex-col items-center gap-1 text-primary" href="#">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
      <span class="font-label-sm">记账</span>
    </a>
    <a class="flex flex-col items-center gap-1 text-on-surface-variant" href="accounts.html">

    </a>

  <!-- FAB -->
  <button id="addTransactionBtn" onclick="openAddTransactionModal();" class="group fixed bottom-10 right-10 w-16 h-16 bg-primary text-white rounded-full items-center justify-center shadow-2xl hover:scale-110 transition-transform active:scale-95 z-40 cursor-pointer">
    <span class="material-symbols-outlined text-[32px]">add</span>
    <span class="absolute right-20 bg-white text-primary px-4 py-2 rounded-xl whitespace-nowrap shadow-xl opacity-0 group-hover:opacity-100 transition-opacity font-bold">添加交易</span>
  </button>

  <!-- Add Transaction Modal -->
  <div id="addTransactionModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center">
    <div class="bg-surface-container-lowest rounded-3xl p-8 w-full max-w-md mx-4 soft-glow max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-6">
        <h2 class="font-headline-md text-headline-md text-on-surface">添加交易</h2>
        <button onclick="closeAddTransactionModal()" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors cursor-pointer">
          <span class="material-symbols-outlined text-on-surface-variant">close</span>
        </button>
      </div>
      <form id="addTransactionForm" class="space-y-4">
        <div>
          <label class="block font-label-sm text-on-surface-variant mb-2">交易类型</label>
          <select id="transactionType" class="w-full h-12 px-4 bg-surface-container rounded-xl border border-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none">
            <option value="2">支出</option>
            <option value="1">收入</option>
          </select>
        </div>
        <div>
          <label class="block font-label-sm text-on-surface-variant mb-2">金额</label>
          <input id="amount" type="number" step="0.01" placeholder="0.00" class="w-full h-12 px-4 bg-surface-container rounded-xl border border-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none">
        </div>
        <div>
          <label class="block font-label-sm text-on-surface-variant mb-2">商家/商户</label>
          <input id="merchantName" type="text" placeholder="请输入商家名称" class="w-full h-12 px-4 bg-surface-container rounded-xl border border-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none">
        </div>
        <div>
          <label class="block font-label-sm text-on-surface-variant mb-2">分类</label>
          <select id="categoryId" class="w-full h-12 px-4 bg-surface-container rounded-xl border border-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none">
            <option value="">请选择分类</option>
          </select>
        </div>
        <div>
          <label class="block font-label-sm text-on-surface-variant mb-2">账户</label>
          <select id="accountId" class="w-full h-12 px-4 bg-surface-container rounded-xl border border-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none">
            <option value="">请选择账户</option>
          </select>
        </div>
        <div>
          <label class="block font-label-sm text-on-surface-variant mb-2">日期</label>
          <input id="transactionDate" type="date" class="w-full h-12 px-4 bg-surface-container rounded-xl border border-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none">
        </div>
        <div>
          <label class="block font-label-sm text-on-surface-variant mb-2">备注</label>
          <input id="description" type="text" placeholder="可选" class="w-full h-12 px-4 bg-surface-container rounded-xl border border-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none">
        </div>
        <div class="flex gap-4 pt-4">
          <button type="button" onclick="closeAddTransactionModal()" class="flex-1 h-12 bg-surface-container text-on-surface rounded-xl font-headline-md cursor-pointer">取消</button>
          <button type="submit" class="flex-1 h-12 bg-primary text-white rounded-xl font-headline-md cursor-pointer">确定</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8080/api/v1';

    // 获取访问令牌
    function getAccessToken() {
      let token = localStorage.getItem('access_token');

      // 如果存储的是完整格式（access|refresh），只取access部分
      if (token && token.includes('|')) {
        token = token.split('|')[0];
      }

      console.log('Token:', token ? '存在' : '不存在');
      return token;
    }

    // 格式化金额
    function formatCurrency(amount, showSign = true) {
      if (amount === null || amount === undefined) return '¥0.00';
      const num = parseFloat(amount);
      const formatted = '¥' + Math.abs(num).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (showSign && num < 0) return '-' + formatted;
      if (showSign && num > 0) return '+' + formatted;
      return formatted;
    }

    // 获取图标
    function getCategoryIcon(categoryName) {
      const iconMap = {
        '餐饮': 'restaurant',
        '交通': 'commute',
        '购物': 'shopping_bag',
        '娱乐': 'sports_esports',
        '居住': 'home',
        '医疗': 'medical_services',
        '教育': 'school',
        '旅行': 'flight',
        '收入': 'payments',
        '工资': 'account_balance',
        '投资': 'trending_up',
        '默认': 'receipt'
      };
      return iconMap[categoryName] || iconMap['默认'];
    }

    // 显示登录提示
    function showLoginPrompt() {
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('summary-section').classList.add('hidden');
      document.getElementById('filter-section').classList.add('hidden');
      document.getElementById('empty-state').classList.remove('hidden');
      document.getElementById('empty-state').innerHTML = `
        <div class="text-center w-full">
          <span class="material-symbols-outlined text-[64px] text-on-surface-variant">login</span>
          <p class="text-on-surface-variant mb-4">请先登录</p>
          <button onclick="window.location.href='auth/login.html'" class="px-6 py-2 bg-primary text-white rounded-xl cursor-pointer">去登录</button>
        </div>
      `;
    }

    // 加载记账汇总数据
    async function loadBookkeepingSummary(startDate, endDate) {
      const token = getAccessToken();
      console.log('Token:', token);

      if (!token) {
        console.log('没有Token，显示登录提示');
        showLoginPrompt();
        return;
      }

      try {
        let url = API_BASE + '/transactions/summary';
        if (startDate && endDate) {
          url += '?startDate=' + startDate + '&endDate=' + endDate;
        }

        console.log('正在加载记账汇总数据...');
        const response = await fetch(url, {
          method: 'GET',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          }
        });

        console.log('响应状态:', response.status);

        if (response.status === 401 || response.status === 403) {
          console.log('权限问题，显示登录提示');
          showLoginPrompt();
          return;
        }

        const result = await response.json();
        console.log('API响应:', result);

        if (result.code === 200 && result.data) {
          console.log('更新UI');
          updateUI(result.data);
        } else {
          console.log('数据为空或返回错误');
          showEmptyState();
        }
      } catch (error) {
        console.error('加载数据失败:', error);
        showEmptyState();
      }
    }

    // 更新UI
    function updateUI(data) {
      // 隐藏加载状态
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('summary-section').classList.remove('hidden');
      document.getElementById('filter-section').classList.remove('hidden');
      document.getElementById('transaction-section').classList.remove('hidden');
      document.getElementById('empty-state').classList.add('hidden');

      // 月度摘要
      document.getElementById('month-title').textContent = data.monthInfo || '2024年01月';
      document.getElementById('monthly-expense').textContent = '-' + formatCurrency(data.monthlyExpense, false);
      document.getElementById('daily-average').textContent = formatCurrency(data.dailyAverageExpense, false);
      document.getElementById('budget-status').textContent = data.budgetStatus || '进度正常';
      document.getElementById('budget-status').className = getBudgetStatusClass(data.budgetStatus);

      // 待报销
      document.getElementById('reimbursable-amount').textContent = formatCurrency(data.reimbursableAmount, false);
      document.getElementById('reimbursable-count').textContent = data.reimbursableCount || 0;

      // 保存原始数据用于前端筛选
      originalTransactionsData = JSON.parse(JSON.stringify(data.transactions || []));

      // 重置筛选条件
      currentFilters = {
        searchText: '',
        startDate: null,
        endDate: null,
        categoryId: null
      };

      // 渲染交易列表
      renderTransactions(data.transactions || []);
    }

    function getBudgetStatusClass(status) {
      if (status === '进度正常') return 'bg-tertiary-container/30 text-on-tertiary-container px-3 py-1 rounded-full text-xs font-bold';
      if (status === '接近预算') return 'bg-secondary-container text-on-secondary-fixed px-3 py-1 rounded-full text-xs font-bold';
      if (status === '超出预算') return 'bg-error-container text-on-error-container px-3 py-1 rounded-full text-xs font-bold';
      return 'bg-surface-container text-on-surface-variant px-3 py-1 rounded-full text-xs font-bold';
    }

    // 全局变量存储原始交易数据
    let originalTransactionsData = [];

    // 当前筛选条件
    let currentFilters = {
      searchText: '',
      startDate: null,
      endDate: null,
      categoryId: null
    };

    function renderTransactions(dailyTransactions) {
      const section = document.getElementById('transaction-section');
      section.innerHTML = '';

      if (!dailyTransactions || dailyTransactions.length === 0) {
        showEmptyState();
        return;
      }

      dailyTransactions.forEach(daily => {
        const dayGroup = document.createElement('div');
        dayGroup.innerHTML = `
          <h4 class="text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-4">${daily.dateTitle}</h4>
          <div class="bg-white rounded-2xl soft-glow border border-white overflow-hidden">
            ${daily.transactions.map(t => createTransactionItem(t)).join('')}
          </div>
        `;
        section.appendChild(dayGroup);
      });
    }

    function createTransactionItem(transaction) {
      const isExpense = transaction.transactionType === 2;
      const amountClass = isExpense ? 'text-data-outflow' : 'text-data-inflow';
      const amountPrefix = isExpense ? '-' : '+';
      const icon = getCategoryIcon(transaction.categoryName);

      return `
        <div class="flex items-center p-4 hover:bg-surface-container-low transition-colors border-b border-outline-variant last:border-0 cursor-pointer">
          <div class="h-12 w-12 rounded-xl bg-surface-container-highest flex items-center justify-center text-primary">
            <span class="material-symbols-outlined">${icon}</span>
          </div>
          <div class="ml-4 flex-1">
            <p class="text-body-md font-semibold text-on-surface">${transaction.merchantName || '未知商户'}</p>
            <div class="flex items-center gap-2 text-sm text-on-surface-variant">
              <span>${transaction.categoryName || '未分类'}</span>
              <span class="h-1 w-1 bg-outline rounded-full"></span>
              <span>${transaction.accountName || '未知账户'}</span>
            </div>
          </div>
          <div class="text-right">
            <p class="font-label-data font-bold ${amountClass}">${amountPrefix}${formatCurrency(transaction.amount, false)}</p>
            <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-tight bg-surface-variant text-on-surface-variant">已完成</span>
          </div>
        </div>
      `;
    }

    function showEmptyState() {
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('summary-section').classList.add('hidden');
      document.getElementById('filter-section').classList.add('hidden');
      document.getElementById('transaction-section').classList.add('hidden');
      document.getElementById('empty-state').classList.remove('hidden');
      document.getElementById('empty-state').innerHTML = `
        <span class="material-symbols-outlined text-[64px] text-on-surface-variant">receipt_long</span>
        <p class="text-on-surface-variant mt-4">暂无交易记录</p>
        <button id="add-first-transaction-btn" class="mt-4 px-6 py-2 bg-primary text-white rounded-xl cursor-pointer">添加第一笔交易</button>
      `;
    }

    // 打开添加交易模态框
    function openAddTransactionModal() {
      document.getElementById('addTransactionModal').classList.remove('hidden');
      document.getElementById('addTransactionModal').classList.add('flex');
      // 设置默认日期为今天
      document.getElementById('transactionDate').valueAsDate = new Date();
    }

    // 关闭添加交易模态框
    function closeAddTransactionModal() {
      document.getElementById('addTransactionModal').classList.add('hidden');
      document.getElementById('addTransactionModal').classList.remove('flex');
      document.getElementById('addTransactionForm').reset();
    }

    // 加载账户列表
    async function loadAccounts() {
      const token = getAccessToken();
      if (!token) return;

      try {
        const response = await fetch(API_BASE + '/accounts', {
          method: 'GET',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          }
        });

        if (response.ok) {
          const result = await response.json();
          if (result.data && result.data.records) {
            const select = document.getElementById('accountId');
            result.data.records.forEach(account => {
              const option = document.createElement('option');
              option.value = account.id;
              option.textContent = account.bankName;
              select.appendChild(option);
            });
          }
        }
      } catch (error) {
        console.error('加载账户失败:', error);
      }
    }

    // 创建交易
    async function createTransaction(formData) {
      const token = getAccessToken();
      if (!token) {
        showLoginPrompt();
        return;
      }

      try {
        const response = await fetch(API_BASE + '/transactions', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        const result = await response.json();
        if (result.code === 200 || result.code === 201) {
          closeAddTransactionModal();
          loadBookkeepingSummary();
          alert('交易创建成功！');
        } else {
          alert(result.message || '创建失败');
        }
      } catch (error) {
        console.error('创建交易失败:', error);
        alert('创建交易失败，请重试');
      }
    }

    // 页面加载完成后获取数据
    document.addEventListener('DOMContentLoaded', function() {
      loadBookkeepingSummary();
      loadAccounts();
      addCategoryDefaults();

      // 添加交易按钮
      document.getElementById('addTransactionBtn').addEventListener('click', openAddTransactionModal);
      document.getElementById('add-first-transaction-btn')?.addEventListener('click', openAddTransactionModal);

      // 搜索输入
      const searchInput = document.getElementById('search-input');
      let searchTimeout;
      searchInput.addEventListener('input', function(e) {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          filterTransactions();
        }, 300);
      });

      // 日期筛选按钮
      document.getElementById('filter-date-btn').addEventListener('click', function() {
        showDateFilterModal();
      });

      // 分类筛选按钮
      document.getElementById('filter-category-btn').addEventListener('click', function() {
        showCategoryFilterModal();
      });

      // 表单提交
      document.getElementById('addTransactionForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const dateValue = document.getElementById('transactionDate').value;
        // 转换为 yyyy-MM-dd HH:mm:ss 格式
        const formattedDate = dateValue ? dateValue + ' 00:00:00' : null;
        const formData = {
          transactionType: parseInt(document.getElementById('transactionType').value),
          amount: parseFloat(document.getElementById('amount').value),
          merchantName: document.getElementById('merchantName').value || null,
          categoryId: parseInt(document.getElementById('categoryId').value) || null,
          accountId: parseInt(document.getElementById('accountId').value),
          transactionDate: formattedDate,
          description: document.getElementById('description').value || null
        };
        createTransaction(formData);
      });
    });

    // 筛选交易记录（前端筛选）
    function filterTransactions() {
      const searchText = document.getElementById('search-input').value.toLowerCase().trim();
      currentFilters.searchText = searchText;
      applyFilters();
    }

    // 应用所有筛选条件
    function applyFilters() {
      const section = document.getElementById('transaction-section');
      section.innerHTML = '';

      let filteredData = JSON.parse(JSON.stringify(originalTransactionsData));

      // 1. 应用日期筛选
      if (currentFilters.startDate && currentFilters.endDate) {
        filteredData = filteredData.map(daily => {
          const filteredTransactions = daily.transactions.filter(t => {
            const transDate = t.transactionDate ? t.transactionDate.split(' ')[0] : '';
            return transDate >= currentFilters.startDate && transDate <= currentFilters.endDate;
          });
          return { ...daily, transactions: filteredTransactions };
        }).filter(daily => daily.transactions.length > 0);
      }

      // 2. 应用分类筛选
      if (currentFilters.categoryId !== null) {
        // 定义分类名称映射
        const categoryNames = {
          1: '工资', 2: '奖金', 3: '投资收入', 4: '副业', 5: '理财收益',
          10: '餐饮', 11: '早午晚餐', 12: '外卖', 13: '下午茶',
          20: '居住', 21: '房租/房贷', 22: '水电气', 23: '物业费',
          30: '交通', 31: '公共交通', 32: '打车', 33: '私家车',
          40: '购物', 50: '医疗', 60: '教育', 70: '娱乐',
          80: '旅游', 90: '社交', 100: '投资'
        };
        const categoryName = categoryNames[currentFilters.categoryId] || '';

        filteredData = filteredData.map(daily => {
          const filteredTransactions = daily.transactions.filter(t => {
            // 匹配categoryId或categoryName
            return t.categoryId === currentFilters.categoryId ||
                   (categoryName && t.categoryName === categoryName);
          });
          return { ...daily, transactions: filteredTransactions };
        }).filter(daily => daily.transactions.length > 0);
      }

      // 3. 应用搜索筛选
      if (currentFilters.searchText) {
        filteredData = filteredData.map(daily => {
          const filteredTransactions = daily.transactions.filter(t => {
            const merchant = (t.merchantName || '').toLowerCase();
            const desc = (t.description || '').toLowerCase();
            const category = (t.categoryName || '').toLowerCase();
            const account = (t.accountName || '').toLowerCase();
            return merchant.includes(currentFilters.searchText) || desc.includes(currentFilters.searchText) ||
                   category.includes(currentFilters.searchText) || account.includes(currentFilters.searchText);
          });
          return { ...daily, transactions: filteredTransactions };
        }).filter(daily => daily.transactions.length > 0);
      }

      if (filteredData.length === 0 || filteredData.every(daily => daily.transactions.length === 0)) {
        section.innerHTML = '<div class="text-center py-12 text-on-surface-variant">没有匹配的交易记录</div>';
        return;
      }

      filteredData.forEach(daily => {
        const dayGroup = document.createElement('div');
        dayGroup.innerHTML = `
          <h4 class="text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-4">${daily.dateTitle}</h4>
          <div class="bg-white rounded-2xl soft-glow border border-white overflow-hidden">
            ${daily.transactions.map(t => createTransactionItem(t)).join('')}
          </div>
        `;
        section.appendChild(dayGroup);
      });
    }

    // 添加默认分类选项
    function addCategoryDefaults() {
      const categorySelect = document.getElementById('categoryId');
      const categories = [
        { id: 1, name: '工资' },
        { id: 2, name: '奖金' },
        { id: 3, name: '投资收入' },
        { id: 4, name: '副业' },
        { id: 5, name: '理财收益' },
        { id: 10, name: '餐饮' },
        { id: 11, name: '早午晚餐' },
        { id: 12, name: '外卖' },
        { id: 13, name: '下午茶' },
        { id: 20, name: '居住' },
        { id: 21, name: '房租/房贷' },
        { id: 22, name: '水电气' },
        { id: 23, name: '物业费' },
        { id: 30, name: '交通' },
        { id: 31, name: '公共交通' },
        { id: 32, name: '打车' },
        { id: 33, name: '私家车' },
        { id: 40, name: '购物' },
        { id: 50, name: '医疗' },
        { id: 60, name: '教育' },
        { id: 70, name: '娱乐' },
        { id: 80, name: '旅游' },
        { id: 90, name: '社交' },

      categories.forEach(cat => {

    }

    // 显示日期筛选弹窗
    function showDateFilterModal() {
      const modal = document.createElement('div');
      modal.className = 'fixed inset-0 bg-black/50 z-50 flex items-center justify-center';
      modal.innerHTML = `
        <div class="bg-surface-container-lowest rounded-3xl p-6 w-full max-w-sm mx-4">
          <h3 class="font-headline-md text-lg mb-4">选择日期范围</h3>
          <div class="space-y-3">
            <button onclick="filterByDatePreset('today')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-surface-container transition-colors">今天</button>
            <button onclick="filterByDatePreset('yesterday')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-surface-container transition-colors">昨天</button>
            <button onclick="filterByDatePreset('thisWeek')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-surface-container transition-colors">本周</button>
            <button onclick="filterByDatePreset('thisMonth')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-surface-container transition-colors">本月</button>
            <button onclick="filterByDatePreset('lastMonth')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-surface-container transition-colors">上月</button>
          </div>
          <button onclick="this.closest('.fixed').remove()" class="mt-4 w-full py-3 bg-surface-container rounded-xl">关闭</button>
        </div>
      `;
      document.body.appendChild(modal);
      modal.addEventListener('click', function(e) {
        if (e.target === modal) modal.remove();
      });
    }

    // 根据预设日期筛选
    function filterByDatePreset(preset) {
      const now = new Date();
      let startDate, endDate;

      switch(preset) {
        case 'today':
          startDate = endDate = new Date().toISOString().split('T')[0];
          break;
        case 'yesterday':
          const yesterday = new Date(now);
          yesterday.setDate(yesterday.getDate() - 1);
          startDate = endDate = yesterday.toISOString().split('T')[0];
          break;
        case 'thisWeek':
          const weekStart = new Date(now);
          weekStart.setDate(now.getDate() - now.getDay());
          startDate = weekStart.toISOString().split('T')[0];
          endDate = new Date().toISOString().split('T')[0];
          break;
        case 'thisMonth':
          startDate = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
          endDate = new Date().toISOString().split('T')[0];
          break;
        case 'lastMonth':
          const lastMonthStart = new Date(now.getFullYear(), now.getMonth() - 1, 1);
          const lastMonthEnd = new Date(now.getFullYear(), now.getMonth(), 0);
          startDate = lastMonthStart.toISOString().split('T')[0];
          endDate = lastMonthEnd.toISOString().split('T')[0];
          break;
      }

      // 更新当前筛选条件
      currentFilters.startDate = startDate;
      currentFilters.endDate = endDate;

      // 使用已加载的数据进行前端筛选
      if (originalTransactionsData.length > 0) {
        applyFilters();
      } else {
        // 重新从API加载数据（不带日期参数，让API返回当月数据）
        loadBookkeepingSummary();
      }
      document.querySelector('.fixed.z-50')?.remove();
    }

    // 显示分类筛选弹窗
    function showCategoryFilterModal() {
      const modal = document.createElement('div');
      modal.className = 'fixed inset-0 bg-black/50 z-50 flex items-center justify-center';
      modal.innerHTML = `
        <div class="bg-surface-container-lowest rounded-3xl p-6 w-full max-w-sm mx-4 max-h-[80vh] overflow-y-auto">
          <h3 class="font-headline-md text-lg mb-4">选择分类</h3>
          <div class="space-y-2" id="category-filter-list">
            <button onclick="filterByCategory(null)" class="w-full text-left px-4 py-3 rounded-xl hover:bg-surface-container transition-colors font-medium">全部</button>
            <button onclick="filterByCategory(1)" class="w-full text-left px-4 py-3 rounded-xl hover:bg-surface-container transition-colors">工资</button>
            <button onclick="filterByCategory(2)" class="w-full text-left px-4 py-3 rounded-xl hover:bg-surface-container transition-colors">奖金</button>
            <button onclick="filterByCategory(3)" class="w-full text-left px-4 py-3 rounded-xl hover:bg-surface-container transition-colors">投资收入</button>
            <button onclick="filterByCategory(4)" class="w-full text-left px-4 py-3 rounded-xl hover:bg-surface-container transition-colors">副业</button>
            <button onclick="filterByCategory(10)" class="w-full text-left px-4 py-3 rounded-xl hover:bg-surface-container transition-colors">餐饮</button>
            <button onclick="filterByCategory(11)" class="w-full text-left px-4 py-3 rounded-xl hover:bg-surface-container transition-colors">早午晚餐</button>
            <button onclick="filterByCategory(12)" class="w-full text-left px-4 py-3 rounded-xl hover:bg-surface-container transition-colors">外卖</button>
            <button onclick="filterByCategory(20)" class="w-full text-left px-4 py-3 rounded-xl hover:bg-surface-container transition-colors">居住</button>
            <button onclick="filterByCategory(30)" class="w-full text-left px-4 py-3 rounded-xl hover:bg-surface-container transition-colors">交通</button>
            <button onclick="filterByCategory(40)" class="w-full text-left px-4 py-3 rounded-xl hover:bg-surface-container transition-colors">购物</button>
            <button onclick="filterByCategory(50)" class="w-full text-left px-4 py-3 rounded-xl hover:bg-surface-container transition-colors">医疗</button>
            <button onclick="filterByCategory(60)" class="w-full text-left px-4 py-3 rounded-xl hover:bg-surface-container transition-colors">教育</button>
            <button onclick="filterByCategory(70)" class="w-full text-left px-4 py-3 rounded-xl hover:bg-surface-container transition-colors">娱乐</button>
          </div>
          <button onclick="this.closest('.fixed').remove()" class="mt-4 w-full py-3 bg-surface-container rounded-xl">关闭</button>
        </div>
      `;
      document.body.appendChild(modal);
      modal.addEventListener('click', function(e) {
        if (e.target === modal) modal.remove();
      });
    }

    // 根据分类筛选
    function filterByCategory(categoryId) {
      // 更新当前筛选条件
      currentFilters.categoryId = categoryId;

      // 如果有原始数据，进行前端筛选
      if (originalTransactionsData.length > 0) {
        applyFilters();
      } else {
        // 重新加载数据
        loadBookkeepingSummary();
      }
      document.querySelector('.fixed.z-50')?.remove();
    }
  </script>
