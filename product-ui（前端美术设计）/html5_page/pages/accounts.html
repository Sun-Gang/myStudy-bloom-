<!DOCTYPE html>

      <!-- Summary Bubble -->

        </div>
        <div class="font-headline-md text-on-surface">银行卡</div>

        <div class="mt-4 flex -space-x-2">

      <!-- Investment Portfolio -->

  <!-- Add Account Modal -->
  <div id="addAccountModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center">

        </button>

          <label class="block font-label-sm text-on-surface-variant mb-2">账户类型</label>
          <select id="accountType" class="w-full h-12 px-4 bg-surface-container rounded-xl border border-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none">
            <option value="1">储蓄卡</option>
            <option value="2">信用卡</option>
            <option value="3">证券</option>
            <option value="4">基金</option>
            <option value="5">社保</option>
            <option value="6">公积金</option>
            <option value="7">负债</option>
            <option value="8">其他</option>
          </select>
        </div>
        <div>
          <label class="block font-label-sm text-on-surface-variant mb-2">银行名称</label>
          <input id="bankName" type="text" placeholder="请输入银行名称" class="w-full h-12 px-4 bg-surface-container rounded-xl border border-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none">
        </div>
        <div>
          <label class="block font-label-sm text-on-surface-variant mb-2">卡号（选填）</label>
          <input id="cardNo" type="text" placeholder="请输入卡号" class="w-full h-12 px-4 bg-surface-container rounded-xl border border-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none">
        </div>
        <div>
          <label class="block font-label-sm text-on-surface-variant mb-2">余额</label>
          <input id="balance" type="number" step="0.01" placeholder="0.00" class="w-full h-12 px-4 bg-surface-container rounded-xl border border-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none">
        </div>
        <div class="flex gap-4 pt-4">
          <button type="button" onclick="closeAddAccountModal()" class="flex-1 h-12 bg-surface-container text-on-surface rounded-xl font-headline-md">取消</button>

        </div>
      </form>
    </div>

  <script>
    const API_BASE = 'http://localhost:8080/api/v1';

    // 格式化金额
    function formatCurrency(amount) {
      if (amount === null || amount === undefined) return '¥ 0.00';
      return '¥ ' + parseFloat(amount).toLocaleString('zh-CN', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    // 格式化百分比
    function formatPercent(value) {
      if (value === null || value === undefined) return '0%';
      return parseFloat(value).toFixed(1) + '%';
    }

    // 获取访问令牌
    function getAccessToken() {
      return localStorage.getItem('access_token');
    }

    // 加载账户汇总数据
    async function loadAccountSummary() {
      const token = getAccessToken();
      console.log('Token:', token ? '存在' : '不存在');
      if (!token) {
        showLoginPrompt();
        return;
      }

      try {
        const response = await fetch(API_BASE + '/accounts/summary', {
          method: 'GET',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          }
        });

        console.log('Response status:', response.status);

        if (response.status === 401 || response.status === 403) {
          console.warn('认证失败');
          showLoginPrompt();
          return;
        }

        if (!response.ok) {
          console.error('请求失败:', response.status);
          showError();
          return;
        }

        const result = await response.json();
        console.log('Result:', result);

        if (result.code === 200 && result.data) {
          updateUI(result.data);
        } else {
          console.error('返回数据异常:', result);
          showError();
        }
      } catch (error) {
        console.error('加载账户数据失败:', error);
        showError();
      }
    }

    // 更新UI
    function updateUI(data) {
      // 隐藏加载状态
      document.getElementById('loading-state').style.display = 'none';

      // 总净资产卡片
      document.getElementById('total-balance-card').classList.remove('hidden');
      document.getElementById('total-net-worth').textContent = formatCurrency(data.totalNetWorth);
      document.getElementById('health-status').textContent = data.healthStatus || '暂无数据';

      // 增长提示
      document.getElementById('summary-bubble').classList.remove('hidden');
      const growthRate = data.monthlyGrowthRate || 0;
      document.getElementById('growth-text').textContent = `本月你的净资产增长了 ${formatPercent(growthRate)}。`;

      // 银行卡
      if (data.bankCardSummary) {
        document.getElementById('bank-card').classList.remove('hidden');
        document.getElementById('bank-card-count').textContent = `${data.bankCardSummary.count || 0} 活跃`;
        document.getElementById('bank-card-balance').textContent = formatCurrency(data.bankCardSummary.balance);
      }

      // 投资账户
      if (data.investmentSummary) {
        document.getElementById('investment-card').classList.remove('hidden');
        document.getElementById('investment-balance').textContent = formatCurrency(data.investmentSummary.balance);
        const percentage = data.investmentSummary.percentage || 0;
        document.getElementById('investment-rate').textContent = `+${formatPercent(percentage)}`;
        document.getElementById('investment-bar').style.width = `${Math.min(percentage, 100)}%`;
      }

      // 社保公积金
      if (data.socialSecuritySummary) {
        document.getElementById('social-security-card').classList.remove('hidden');
        document.getElementById('social-security-balance').textContent = formatCurrency(data.socialSecuritySummary.balance);
        document.getElementById('social-security-date').textContent = data.socialSecuritySummary.lastPaymentDate || '暂无缴存记录';
      }

      // 负债
      if (data.liabilitySummary) {
        document.getElementById('liability-card').classList.remove('hidden');
        const liabilityAmount = data.liabilitySummary.totalAmount || 0;
        document.getElementById('liability-amount').textContent = '-' + formatCurrency(liabilityAmount);
        const liabilityPercent = data.liabilitySummary.percentage || 0;
        document.getElementById('liability-bar').style.width = `${Math.min(liabilityPercent, 100)}%`;
      }

      // 固定资产
      if (data.fixedAssetSummary) {
        document.getElementById('fixed-asset-card').classList.remove('hidden');
        document.getElementById('fixed-asset-amount').textContent = formatCurrency(data.fixedAssetSummary.totalAmount);
        document.getElementById('property-count').textContent = `房产 (${data.fixedAssetSummary.propertyCount || 0})`;
        document.getElementById('vehicle-count').textContent = `汽车 (${data.fixedAssetSummary.vehicleCount || 0})`;
      }
    }

    // 显示登录提示
    function showLoginPrompt() {
      document.getElementById('loading-state').innerHTML = `
        <div class="text-center">
          <p class="text-on-surface-variant mb-4">请先登录</p>
          <button onclick="window.location.href='./auth/login.html'" class="px-6 py-2 bg-primary text-white rounded-xl">
            去登录
          </button>
        </div>
      `;
    }

    // 显示错误
    function showError() {
      document.getElementById('loading-state').innerHTML = `
        <div class="text-center">
          <p class="text-error mb-4">加载失败，请刷新重试</p>
        </div>
      `;
    }

    // 打开添加账户模态框
    function openAddAccountModal() {
      document.getElementById('addAccountModal').classList.remove('hidden');
      document.getElementById('addAccountModal').classList.add('flex');
    }

    // 关闭添加账户模态框
    function closeAddAccountModal() {
      document.getElementById('addAccountModal').classList.add('hidden');
      document.getElementById('addAccountModal').classList.remove('flex');
      document.getElementById('addAccountForm').reset();
    }

    // 创建账户
    async function createAccount(formData) {
      const token = getAccessToken();
      if (!token) {
        showLoginPrompt();
        return;
      }

      try {
        const response = await fetch(API_BASE + '/accounts', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        const result = await response.json();
        if (result.code === 200 || result.code === 201) {
          closeAddAccountModal();
          loadAccountSummary(); // 刷新数据
          alert('账户创建成功！');
        } else {
          alert(result.message || '创建失败');
        }
      } catch (error) {
        console.error('创建账户失败:', error);
        alert('创建账户失败，请重试');
      }
    }

    // 页面加载完成后获取数据并绑定事件
    document.addEventListener('DOMContentLoaded', function() {
      loadAccountSummary();

      // 绑定移动端添加按钮
      document.getElementById('addAccountBtnMobile').addEventListener('click', openAddAccountModal);

      // 绑定桌面端添加按钮
      document.getElementById('addAccountBtnDesktop').addEventListener('click', openAddAccountModal);

      // 绑定存入按钮 - 跳转到记账页面
      document.getElementById('depositBtn').addEventListener('click', function() {
        window.location.href = 'bookkeeping.html';
      });

      // 绑定分析按钮 - 跳转到分析页面
      document.getElementById('analyzeBtn').addEventListener('click', function() {
        window.location.href = 'analysis.html';
      });

      // 表单提交
      document.getElementById('addAccountForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = {
          accountType: parseInt(document.getElementById('accountType').value),
          bankName: document.getElementById('bankName').value,
          cardNo: document.getElementById('cardNo').value,
          balance: parseFloat(document.getElementById('balance').value) || 0
        };
        createAccount(formData);
      });
    });
  </script>
</body>

</html>
