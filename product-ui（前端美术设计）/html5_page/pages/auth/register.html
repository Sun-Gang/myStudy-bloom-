<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bloom Finance - 注册</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&amp;family=Be+Vietnam+Pro:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "on-tertiary": "#ffffff", "on-error": "#ffffff",
        "on-tertiary-container": "#256036", "on-secondary": "#ffffff",
        "on-error-container": "#93000a", "surface-container-highest": "#f2dde4",
        "primary-fixed": "#ffd9df", "on-secondary-fixed": "#1e1c00",
        "inverse-surface": "#3a2d32", "tertiary-fixed": "#b2f2bb",
        "surface-container": "#fee8f0", "on-secondary-fixed-variant": "#4b4822",
        "tertiary": "#2f6a3f", "surface-container-high": "#f8e3ea",
        "secondary": "#636037", "on-primary-container": "#7b4551",
        "error": "#ba1a1a", "secondary-container": "#e7e1ae",
        "surface-dim": "#ead5dc", "on-secondary-container": "#67643b",
        "outline-variant": "#d6c2c4", "background": "#fff8f8",
        "on-tertiary-fixed": "#00210b", "on-background": "#24181d",
        "primary-fixed-dim": "#fbb3c1", "secondary-fixed-dim": "#cdc897",
        "on-tertiary-fixed-variant": "#145129", "inverse-primary": "#fbb3c1",
        "surface-container-lowest": "#ffffff", "on-primary-fixed": "#360c19",
        "outline": "#837375", "surface-variant": "#f2dde4",
        "on-primary": "#ffffff", "tertiary-fixed-dim": "#96d5a0",
        "primary-container": "#ffb7c5", "on-surface-variant": "#514345",
        "inverse-on-surface": "#ffecf2", "tertiary-container": "#9ad9a4",
        "surface-tint": "#864e5a", "on-primary-fixed-variant": "#6b3743",
        "error-container": "#ffdad6", "surface": "#fff8f8",
        "surface-container-low": "#fff0f4", "on-surface": "#24181d",
        "primary": "#864e5a", "surface-bright": "#fff8f8",
        "secondary-fixed": "#eae4b1"
      },
      borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
      spacing: { "section-gap": "40px", "element-gap": "16px", "gutter": "16px", "container-padding": "24px", base: "8px" },
      fontFamily: { "body-md": ["Be Vietnam Pro"], "label-sm": ["Be Vietnam Pro"], "display-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "display-lg-mobile": ["Plus Jakarta Sans"], "body-lg": ["Be Vietnam Pro"] }
    }
  }
};
</script>
<style>
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.soft-glow-card { box-shadow: 0 20px 40px -10px rgba(240, 208, 216, 0.5); }
.floating-petal { position: absolute; pointer-events: none; opacity: 0.6; }
.toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: opacity 0.3s; }
.toast.show { opacity: 1; }
.toast.success { background: #b2f2bb; color: #256036; }
.toast.error { background: #ffdad6; color: #93000a; }
</style>
</head>
<body class="bg-background min-h-screen flex flex-col items-center justify-center relative overflow-x-hidden p-6">
<div id="toast" class="toast"></div>

<!-- Decorative Elements -->
<div class="absolute top-20 left-10 w-16 h-16 bg-primary-fixed-dim/30 rounded-full blur-3xl"></div>
<div class="absolute bottom-20 right-10 w-32 h-32 bg-tertiary-fixed-dim/20 rounded-full blur-3xl"></div>

<!-- Floating Petals -->
<div class="floating-petal top-1/4 left-1/4 rotate-12">
  <span class="material-symbols-outlined text-primary-fixed-dim text-4xl">local_florist</span>
</div>
<div class="floating-petal top-1/2 right-1/4 -rotate-45">
  <span class="material-symbols-outlined text-primary-fixed-dim text-2xl">local_florist</span>
</div>
<div class="floating-petal bottom-1/4 left-1/3 rotate-90">
  <span class="material-symbols-outlined text-primary-fixed-dim text-3xl">local_florist</span>
</div>

<!-- Main Registration Card -->
<main class="w-full max-w-[480px] bg-surface-container-lowest rounded-[40px] soft-glow-card z-10 px-8 py-12 md:px-12 md:py-16">

  <!-- Header Section -->
  <header class="flex flex-col items-center mb-10">
    <div class="flex items-center gap-2 mb-4">
      <span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">spa</span>
      <h1 class="font-display-lg-mobile text-display-lg-mobile text-primary font-bold">Bloom Finance</h1>
    </div>
    <p class="font-headline-md text-headline-md text-on-surface-variant text-center">加入我们，让财富如花绽放</p>
  </header>

  <!-- Registration Form -->
  <form id="registerForm" class="space-y-5">
    <!-- Username Input -->
    <div class="space-y-2">
      <label class="font-label-sm text-label-sm text-on-surface-variant ml-2" for="username">用户名</label>
      <div class="relative flex items-center">
        <span class="material-symbols-outlined absolute left-4 text-outline">person</span>
        <input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border-none rounded-2xl focus:ring-2 focus:ring-primary focus:bg-white transition-all font-body-md text-body-md text-on-surface placeholder:text-outline/60" id="username" placeholder="请设置您的用户名" type="text"/>
      </div>
    </div>

    <!-- Email Input -->
    <div class="space-y-2">
      <label class="font-label-sm text-label-sm text-on-surface-variant ml-2" for="email">电子邮箱</label>
      <div class="relative flex items-center">
        <span class="material-symbols-outlined absolute left-4 text-outline">mail</span>
        <input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border-none rounded-2xl focus:ring-2 focus:ring-primary focus:bg-white transition-all font-body-md text-body-md text-on-surface placeholder:text-outline/60" id="email" placeholder="请输入您的电子邮箱地址" type="email"/>
      </div>
    </div>

    <!-- Verification Code -->
    <div class="space-y-2">
      <label class="font-label-sm text-label-sm text-on-surface-variant ml-2" for="verifyCode">验证码</label>
      <div class="flex gap-3">
        <div class="relative flex-1">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">verified_user</span>
          <input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border-none rounded-2xl focus:ring-2 focus:ring-primary focus:bg-white transition-all font-body-md text-body-md text-on-surface placeholder:text-outline/60" id="verifyCode" placeholder="请输入验证码" type="text" maxlength="6"/>
        </div>
        <button id="sendCodeBtn" class="px-4 h-14 bg-secondary-container text-on-secondary-container font-label-sm text-label-sm rounded-2xl hover:bg-secondary/10 transition-colors active:scale-95 whitespace-nowrap" type="button">
          获取验证码
        </button>
      </div>
    </div>

    <!-- Password Input -->
    <div class="space-y-2">
      <label class="font-label-sm text-label-sm text-on-surface-variant ml-2" for="password">设置密码</label>
      <div class="relative flex items-center">
        <span class="material-symbols-outlined absolute left-4 text-outline">lock</span>
        <input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border-none rounded-2xl focus:ring-2 focus:ring-primary focus:bg-white transition-all font-body-md text-body-md text-on-surface placeholder:text-outline/60" id="password" placeholder="请设置6-20位登录密码" type="password"/>
      </div>
    </div>

    <!-- Confirm Password Input -->
    <div class="space-y-2">
      <label class="font-label-sm text-label-sm text-on-surface-variant ml-2" for="confirmPassword">确认密码</label>
      <div class="relative flex items-center">
        <span class="material-symbols-outlined absolute left-4 text-outline">lock_reset</span>
        <input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border-none rounded-2xl focus:ring-2 focus:ring-primary focus:bg-white transition-all font-body-md text-body-md text-on-surface placeholder:text-outline/60" id="confirmPassword" placeholder="请再次输入密码" type="password"/>
      </div>
    </div>

    <!-- Terms Agreement -->
    <div class="flex items-start gap-3 px-2">
      <input class="mt-1 w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary/30" id="terms" type="checkbox"/>
      <label class="font-body-md text-body-md text-on-surface-variant leading-tight" for="terms">
        阅读并同意 <a class="text-primary font-semibold underline decoration-primary/30" href="#">服务协议</a> 与 <a class="text-primary font-semibold underline decoration-primary/30" href="#">隐私政策</a>
      </label>
    </div>

    <!-- Submit Button -->
    <button id="registerBtn" class="w-full h-16 bg-primary text-on-primary rounded-full font-headline-md text-headline-md shadow-lg shadow-primary/20 hover:scale-[0.98] active:scale-95 transition-all mt-4 flex items-center justify-center space-x-2" type="submit">
      <span id="registerBtnText">创建我的财务花园</span>
      <span id="registerSpinner" class="hidden material-symbols-outlined animate-spin">progress_activity</span>
    </button>
  </form>

  <!-- Footer Links -->
  <footer class="mt-8 text-center">
    <p class="font-body-md text-body-md text-on-surface-variant">
      已有账号？ <a class="text-primary font-bold hover:underline" href="login.html">立即登录</a>
    </p>
  </footer>
</main>

<!-- Support Image Decoration -->
<div class="mt-12 hidden md:block opacity-40">
  <img alt="Bloom Decoration" class="h-32 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCNzfgSYXdfyMHmqA2uti8i_xbp39i9v8l7j6Caq9N0PHeMRd-_--sXkcujRRwmCXw3st-X7cKAaAzDKUXjLsYOP3t6AxVoS50aR5CkIKV8wCUTiSDLpKIPl12AREV-6rE-xcAxMINQjXQezboIxN-hxmU2ERfFlTP5wzirexq6PhwASOmKPcXiKr84AnDj6bVvsFJFQcA5SybQIZImB-7uyLwaOz-8cjvwMzKB3BFXwJKiaSRljGg5ZOsiiXl_yl7VPh0vu5GkOqtT"/>
</div>

<script>
const API_BASE = 'http://localhost:8080/api/v1';

function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast ' + type + ' show';
  setTimeout(() => { toast.classList.remove('show'); }, 3000);
}

function setLoading(loading, btnTextId, spinnerId) {
  const btn = document.getElementById('registerBtn');
  const btnText = document.getElementById(btnTextId);
  const spinner = document.getElementById(spinnerId);
  if (loading) {
    btn.disabled = true;
    btnText.classList.add('hidden');
    spinner.classList.remove('hidden');
  } else {
    btn.disabled = false;
    btnText.classList.remove('hidden');
    spinner.classList.add('hidden');
  }
}

let countdownTimer = null;
function startCountdown() {
  const btn = document.getElementById('sendCodeBtn');
  let seconds = 60;
  btn.disabled = true;
  btn.textContent = '60秒后重试';
  countdownTimer = setInterval(() => {
    seconds--;
    if (seconds <= 0) {
      clearInterval(countdownTimer);
      btn.disabled = false;
      btn.textContent = '获取验证码';
    } else {
      btn.textContent = seconds + '秒后重试';
    }
  }, 1000);
}

// 发送验证码
document.getElementById('sendCodeBtn').addEventListener('click', async function() {
  const email = document.getElementById('email').value.trim();

  if (!email) {
    showToast('请输入电子邮箱', 'error');
    return;
  }
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(email)) {
    showToast('请输入有效的电子邮箱', 'error');
    return;
  }

  this.disabled = true;
  try {
    const response = await fetch(API_BASE + '/auth/send-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, type: 1 }) // 1 = REGISTER
    });
    const result = await response.json();
    if (result.code === 200) {
      showToast('验证码已发送至您的邮箱', 'success');
      startCountdown();
    } else {
      showToast(result.message || '发送验证码失败', 'error');
      this.disabled = false;
    }
  } catch (error) {
    console.error('Send code error:', error);
    showToast('网络错误，请检查服务器是否启动', 'error');
    this.disabled = false;
  }
});

// 注册表单提交
document.getElementById('registerForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const verifyCode = document.getElementById('verifyCode').value.trim();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const terms = document.getElementById('terms').checked;

  if (!username) {
    showToast('请输入用户名', 'error');
    return;
  }
  if (!email) {
    showToast('请输入电子邮箱', 'error');
    return;
  }
  if (!verifyCode) {
    showToast('请输入验证码', 'error');
    return;
  }
  if (verifyCode.length !== 6) {
    showToast('验证码应为6位数字', 'error');
    return;
  }
  if (!password) {
    showToast('请输入密码', 'error');
    return;
  }
  if (password.length < 6 || password.length > 20) {
    showToast('密码长度应为6-20位', 'error');
    return;
  }
  if (password !== confirmPassword) {
    showToast('两次输入的密码不一致', 'error');
    return;
  }
  if (!terms) {
    showToast('请阅读并同意服务协议和隐私政策', 'error');
    return;
  }

  setLoading(true, 'registerBtnText', 'registerSpinner');

  try {
    const response = await fetch(API_BASE + '/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: username,
        email: email,
        password: password,
        confirmPassword: confirmPassword,
        code: verifyCode
      })
    });

    const result = await response.json();

    if (result.code === 201) {
      showToast('注册成功，即将跳转到登录页面...', 'success');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1500);
    } else {
      showToast(result.message || '注册失败，请重试', 'error');
    }
  } catch (error) {
    console.error('Register error:', error);
    showToast('网络错误，请检查服务器是否启动', 'error');
  } finally {
    setLoading(false, 'registerBtnText', 'registerSpinner');
  }
});
</script>
</body>
</html>
