<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bloom Finance - 找回密码</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "on-tertiary-fixed": "#00210b", "error": "#ba1a1a",
        "primary-fixed": "#ffd9df", "primary-container": "#ffb7c5",
        "inverse-surface": "#3a2d32", "error-container": "#ffdad6",
        "primary-fixed-dim": "#fbb3c1", "on-tertiary-container": "#256036",
        "secondary-fixed-dim": "#cdc897", "outline-variant": "#d6c2c4",
        "on-secondary-container": "#67643b", "surface-container-high": "#f8e3ea",
        "on-primary-fixed": "#360c19", "on-primary": "#ffffff",
        "surface-variant": "#f2dde4", "surface-container-lowest": "#ffffff",
        "surface-bright": "#fff8f8", "secondary": "#636037",
        "on-error": "#ffffff", "surface-tint": "#864e5a",
        "on-primary-fixed-variant": "#6b3743", "tertiary-fixed-dim": "#96d5a0",
        "surface": "#fff8f8", "tertiary-container": "#9ad9a4",
        "outline": "#837375", "background": "#fff8f8",
        "surface-dim": "#ead5dc", "on-tertiary": "#ffffff",
        "on-secondary-fixed-variant": "#4b4822", "tertiary": "#2f6a3f",
        "surface-container": "#fee8f0", "on-secondary-fixed": "#1e1c00",
        "inverse-on-surface": "#ffecf2", "surface-container-highest": "#f2dde4",
        "surface-container-low": "#fff0f4", "on-tertiary-fixed-variant": "#145129",
        "on-surface": "#24181d", "on-error-container": "#93000a",
        "on-secondary": "#ffffff", "on-background": "#24181d",
        "on-primary-container": "#7b4551", "inverse-primary": "#fbb3c1",
        "secondary-fixed": "#eae4b1", "on-surface-variant": "#514345",
        "primary": "#864e5a", "tertiary-fixed": "#b2f2bb",
        "secondary-container": "#e7e1ae"
      },
      borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", "2xl": "1.5rem", "3xl": "2rem", full: "9999px" },
      spacing: { "element-gap": "16px", "base": "8px", "gutter": "16px", "section-gap": "40px", "container-padding": "24px" },
      fontFamily: { "label-sm": ["Be Vietnam Pro"], "headline-md": ["Plus Jakarta Sans"], "body-lg": ["Be Vietnam Pro"], "display-lg": ["Plus Jakarta Sans"], "body-md": ["Be Vietnam Pro"], "display-lg-mobile": ["Plus Jakarta Sans"] },
      fontSize: { "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}], "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}], "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}], "display-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}], "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}], "display-lg-mobile": ["32px", {"lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "700"}] }
    }
  }
};
</script>
<style>
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.sakura-petal { position: absolute; background: #ffb7c5; border-radius: 100% 0% 100% 0% / 100% 0% 100% 0%; opacity: 0.4; pointer-events: none; z-index: 0; }
.toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: opacity 0.3s; }
.toast.show { opacity: 1; }
.toast.success { background: #b2f2bb; color: #256036; }
.toast.error { background: #ffdad6; color: #93000a; }
</style>
</head>
<body class="bg-background font-body-md text-on-background min-h-screen flex flex-col relative overflow-hidden">

<div id="toast" class="toast"></div>

<!-- Decorative Petals Background -->
<div class="sakura-petal w-6 h-8 rotate-45 top-[10%] left-[5%]"></div>
<div class="sakura-petal w-4 h-6 -rotate-12 top-[25%] right-[8%]"></div>
<div class="sakura-petal w-5 h-7 rotate-[110deg] bottom-[15%] left-[12%]"></div>
<div class="sakura-petal w-3 h-5 rotate-[15deg] bottom-[30%] right-[15%]"></div>

<!-- Top Bar -->
<header class="bg-surface/60 backdrop-blur-xl sticky top-0 z-50 flex justify-between items-center w-full px-container-padding py-base max-w-7xl mx-auto">
  <button onclick="history.back()" class="p-2 text-primary hover:bg-primary-container/20 transition-colors duration-300 rounded-full active:scale-95">
    <span class="material-symbols-outlined">arrow_back</span>
  </button>
  <div class="font-display-lg-mobile text-display-lg-mobile text-primary font-bold tracking-tight">Bloom Finance</div>
  <button class="p-2 text-primary hover:bg-primary-container/20 transition-colors duration-300 rounded-full active:scale-95">
    <span class="material-symbols-outlined">help_outline</span>
  </button>
</header>

<!-- Main Content -->
<main class="flex-grow flex items-center justify-center px-gutter py-section-gap relative z-10">
  <div class="w-full max-w-[480px] bg-white rounded-3xl p-8 md:p-10 shadow-[0_8px_30px_rgb(255,183,197,0.3)] border border-surface-container-high relative overflow-hidden">

    <!-- Step 1: Email Verification -->
    <div id="step1">
      <!-- Illustration Header -->
      <div class="flex flex-col items-center mb-8">
        <div class="w-24 h-24 bg-primary-container/30 rounded-full flex items-center justify-center mb-6 relative">
          <div class="absolute inset-0 bg-primary-container/20 animate-pulse rounded-full"></div>
          <span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">local_florist</span>
        </div>
        <h1 class="font-headline-md text-headline-md text-on-surface mb-2 text-center">找回您的财务花园</h1>
        <p class="font-body-md text-body-md text-on-surface-variant text-center px-4">别担心，我们会帮您重新开启通往财富之花的道路。</p>
      </div>

      <!-- Step 1 Form -->
      <form id="step1Form" class="space-y-6">
        <!-- Email Field -->
        <div class="space-y-2">
          <label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="email">电子邮箱</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/60">mail</span>
            <input class="w-full h-14 pl-12 pr-4 bg-surface-container rounded-2xl border-none focus:ring-2 focus:ring-primary-container focus:bg-white transition-all font-body-md text-on-surface placeholder:text-on-surface-variant/50" id="email" placeholder="请输入您的电子邮箱" type="email"/>
          </div>
        </div>

        <!-- CAPTCHA Field -->
        <div class="space-y-2">
          <label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="verifyCode">验证码</label>
          <div class="flex gap-3">
            <div class="relative flex-grow">
              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/60">verified_user</span>
              <input class="w-full h-14 pl-12 pr-4 bg-surface-container rounded-2xl border-none focus:ring-2 focus:ring-primary-container focus:bg-white transition-all font-body-md text-on-surface placeholder:text-on-surface-variant/50" id="verifyCode" placeholder="请输入6位验证码" type="text" maxlength="6"/>
            </div>
            <button id="sendCodeBtn" class="px-4 h-14 bg-secondary-container text-on-secondary-container font-label-sm text-label-sm rounded-2xl hover:bg-secondary/10 transition-colors active:scale-95 whitespace-nowrap" type="button">
              获取验证码
            </button>
          </div>
          <p class="text-[12px] text-on-surface-variant/70 mt-1.5 px-1">验证码将发送至您的电子邮箱</p>
        </div>

        <!-- Next Step Button -->
        <button id="nextBtn" class="w-full h-14 bg-primary text-on-primary font-headline-md text-headline-md rounded-full shadow-lg shadow-primary/20 hover:bg-on-primary-fixed-variant transition-all transform active:scale-[0.98] mt-4 flex items-center justify-center space-x-2" type="submit">
          <span id="nextBtnText">下一步</span>
          <span id="nextBtnSpinner" class="hidden material-symbols-outlined animate-spin">progress_activity</span>
        </button>
      </form>
    </div>

    <!-- Step 2: Reset Password -->
    <div id="step2" class="hidden">
      <!-- Header -->
      <div class="flex flex-col items-center mb-8">
        <div class="w-20 h-20 bg-tertiary-container/30 rounded-full flex items-center justify-center mb-6">
          <span class="material-symbols-outlined text-[40px] text-tertiary" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
        </div>
        <h1 class="font-headline-md text-headline-md text-on-surface mb-2 text-center">设置新密码</h1>
        <p class="font-body-md text-body-md text-on-surface-variant text-center px-4">请输入您的新密码</p>
      </div>

      <!-- Step 2 Form -->
      <form id="step2Form" class="space-y-6">
        <input type="hidden" id="resetEmail"/>

        <!-- New Password -->
        <div class="space-y-2">
          <label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="newPassword">新密码</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/60">lock</span>
            <input class="w-full h-14 pl-12 pr-12 bg-surface-container rounded-2xl border-none focus:ring-2 focus:ring-primary-container focus:bg-white transition-all font-body-md text-on-surface placeholder:text-on-surface-variant/50" id="newPassword" placeholder="请输入6-20位新密码" type="password"/>
            <button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary" type="button" onclick="togglePassword('newPassword', 'newPwdIcon')">
              <span id="newPwdIcon" class="material-symbols-outlined">visibility</span>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="space-y-2">
          <label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="confirmNewPassword">确认新密码</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/60">lock_reset</span>
            <input class="w-full h-14 pl-12 pr-12 bg-surface-container rounded-2xl border-none focus:ring-2 focus:ring-primary-container focus:bg-white transition-all font-body-md text-on-surface placeholder:text-on-surface-variant/50" id="confirmNewPassword" placeholder="请再次输入新密码" type="password"/>
            <button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary" type="button" onclick="togglePassword('confirmNewPassword', 'confirmPwdIcon')">
              <span id="confirmPwdIcon" class="material-symbols-outlined">visibility</span>
            </button>
          </div>
        </div>

        <!-- Reset Button -->
        <button id="resetBtn" class="w-full h-14 bg-tertiary text-on-tertiary font-headline-md text-headline-md rounded-full shadow-lg shadow-tertiary/20 hover:shadow-tertiary/30 transition-all transform active:scale-[0.98] mt-4 flex items-center justify-center space-x-2" type="submit">
          <span id="resetBtnText">重置密码</span>
          <span id="resetBtnSpinner" class="hidden material-symbols-outlined animate-spin">progress_activity</span>
        </button>
      </form>
    </div>

    <!-- Back Link -->
    <div class="mt-8 pt-6 border-t border-surface-variant flex justify-center">
      <a class="flex items-center gap-2 text-primary font-label-sm text-label-sm hover:underline transition-all" href="login.html">
        <span class="material-symbols-outlined text-[18px]">keyboard_backspace</span>
        返回登录
      </a>
    </div>

    <!-- Subtle Decorative Element -->
    <div class="absolute -bottom-6 -right-6 opacity-10">
      <span class="material-symbols-outlined text-[120px] text-primary" style="font-variation-settings: 'FILL' 1;">light_mode</span>
    </div>
  </div>
</main>

<!-- Visual Footer Decoration -->
<footer class="w-full max-w-7xl mx-auto px-container-padding py-12 flex flex-col items-center gap-4 relative z-10">
  <div class="flex gap-2">
    <div class="w-2 h-2 rounded-full bg-primary-container"></div>
    <div class="w-2 h-2 rounded-full bg-primary-container/40"></div>
    <div class="w-2 h-2 rounded-full bg-primary-container/20"></div>
  </div>
  <p class="font-label-sm text-label-sm text-on-surface-variant/60">© 2024 Bloom Finance. 让您的财富如花绽放。</p>
</footer>

<script>
const API_BASE = 'http://localhost:8080/api/v1';

function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast ' + type + ' show';
  setTimeout(() => { toast.classList.remove('show'); }, 3000);
}

function togglePassword(inputId, iconId) {
  const input = document.getElementById(inputId);
  const icon = document.getElementById(iconId);
  if (input.type === 'password') {
    input.type = 'text';
    icon.textContent = 'visibility_off';
  } else {
    input.type = 'password';
    icon.textContent = 'visibility';
  }
}

function setLoading(loading, btnId, btnTextId, spinnerId) {
  const btn = document.getElementById(btnId);
  const btnText = document.getElementById(btnTextId);
  const spinner = document.getElementById(spinnerId);
  if (loading) {
    btn.disabled = true;
    btnText.classList.add('hidden');
    spinner.classList.remove('hidden');
  } else {
    btn.disabled = false;
    btnText.classList.remove('hidden');
    spinner.classList.add('hidden');
  }
}

let countdownTimer = null;
function startCountdown() {
  const btn = document.getElementById('sendCodeBtn');
  let seconds = 60;
  btn.disabled = true;
  btn.textContent = '60秒后重试';
  countdownTimer = setInterval(() => {
    seconds--;
    if (seconds <= 0) {
      clearInterval(countdownTimer);
      btn.disabled = false;
      btn.textContent = '获取验证码';
    } else {
      btn.textContent = seconds + '秒后重试';
    }
  }, 1000);
}

// 发送验证码
document.getElementById('sendCodeBtn').addEventListener('click', async function() {
  const email = document.getElementById('email').value.trim();

  if (!email) {
    showToast('请输入电子邮箱', 'error');
    return;
  }
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(email)) {
    showToast('请输入有效的电子邮箱', 'error');
    return;
  }

  this.disabled = true;
  try {
    const response = await fetch(API_BASE + '/auth/send-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, type: 3 }) // 3 = FORGOT_PASSWORD
    });
    const result = await response.json();
    if (result.code === 200) {
      showToast('验证码已发送至您的邮箱', 'success');
      startCountdown();
    } else {
      showToast(result.message || '发送验证码失败', 'error');
      this.disabled = false;
    }
  } catch (error) {
    console.error('Send code error:', error);
    showToast('网络错误，请检查服务器是否启动', 'error');
    this.disabled = false;
  }
});

// Step 1: 验证验证码
document.getElementById('step1Form').addEventListener('submit', async function(e) {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const verifyCode = document.getElementById('verifyCode').value.trim();

  if (!email) {
    showToast('请输入电子邮箱', 'error');
    return;
  }
  if (!verifyCode) {
    showToast('请输入验证码', 'error');
    return;
  }
  if (verifyCode.length !== 6) {
    showToast('验证码应为6位数字', 'error');
    return;
  }

  setLoading(true, 'nextBtn', 'nextBtnText', 'nextBtnSpinner');

  try {
    // 调用重置密码接口，先验证验证码
    const response = await fetch(API_BASE + '/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: email,
        code: verifyCode,
        newPassword: '' // 先不传密码，等用户输入
      })
    });

    const result = await response.json();

    if (result.code === 200) {
      // 验证码验证成功，进入步骤2
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
      document.getElementById('resetEmail').value = email;
      showToast('验证码验证成功，请设置新密码', 'success');
    } else {
      showToast(result.message || '验证码验证失败', 'error');
    }
  } catch (error) {
    console.error('Verify error:', error);
    showToast('网络错误，请检查服务器是否启动', 'error');
  } finally {
    setLoading(false, 'nextBtn', 'nextBtnText', 'nextBtnSpinner');
  }
});

// Step 2: 重置密码
document.getElementById('step2Form').addEventListener('submit', async function(e) {
  e.preventDefault();

  const email = document.getElementById('resetEmail').value;
  const verifyCode = document.getElementById('verifyCode').value.trim();
  const newPassword = document.getElementById('newPassword').value;
  const confirmNewPassword = document.getElementById('confirmNewPassword').value;

  if (!newPassword) {
    showToast('请输入新密码', 'error');
    return;
  }
  if (newPassword.length < 6 || newPassword.length > 20) {
    showToast('密码长度应为6-20位', 'error');
    return;
  }
  if (newPassword !== confirmNewPassword) {
    showToast('两次输入的密码不一致', 'error');
    return;
  }

  setLoading(true, 'resetBtn', 'resetBtnText', 'resetBtnSpinner');

  try {
    const response = await fetch(API_BASE + '/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: email,
        code: verifyCode,
        newPassword: newPassword
      })
    });

    const result = await response.json();

    if (result.code === 200) {
      showToast('密码重置成功，即将跳转到登录页面...', 'success');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1500);
    } else {
      showToast(result.message || '密码重置失败', 'error');
    }
  } catch (error) {
    console.error('Reset password error:', error);
    showToast('网络错误，请检查服务器是否启动', 'error');
  } finally {
    setLoading(false, 'resetBtn', 'resetBtnText', 'resetBtnSpinner');
  }
});
</script>
</body>
</html>
