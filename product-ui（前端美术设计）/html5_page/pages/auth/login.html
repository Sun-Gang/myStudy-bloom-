      </div>

        <h2 class="font-headline-md text-headline-md text-primary">繁花盛开，理财有道</h2>

      </div>
    </div>

    <div class="lg:col-span-7 flex justify-center lg:justify-end">
      <div class="bg-surface-container-lowest soft-glow-pink rounded-3xl w-full max-w-[500px] p-8 md:p-12 space-y-10 border border-surface-container-highest/30">
        <div class="text-center space-y-3">
          <div class="flex justify-center mb-4 lg:hidden">
            <span class="font-display-lg-mobile text-display-lg-mobile font-extrabold text-primary">Bloom Finance</span>
          </div>
          <h1 class="font-headline-md text-headline-md text-on-background">欢迎回来</h1>
          <p class="font-body-md text-on-surface-variant">开启美好财务生活，就在今天</p>
        </div>

        <form id="loginForm" class="space-y-6">
          <div class="space-y-4">
            <div class="flex flex-col space-y-2">
              <label class="font-label-sm text-label-sm text-on-surface-variant px-2" for="login-id">用户名 / 邮箱 / 手机号</label>
              <div class="relative bloom-input-focus bg-surface-container-low rounded-2xl transition-all duration-300">
                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/60">person</span>
                <input class="w-full h-[56px] pl-12 pr-4 bg-transparent border-none rounded-2xl focus:ring-0 placeholder:text-outline/50 font-body-md" id="login-id" placeholder="请输入用户名、邮箱或手机号" type="text"/>
              </div>
            </div>
            <div class="flex flex-col space-y-2">
              <label class="font-label-sm text-label-sm text-on-surface-variant px-2" for="password">密码</label>
              <div class="relative bloom-input-focus bg-surface-container-low rounded-2xl transition-all duration-300">
                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/60">lock</span>
                <input class="w-full h-[56px] pl-12 pr-12 bg-transparent border-none rounded-2xl focus:ring-0 placeholder:text-outline/50 font-body-md" id="password" placeholder="请输入登录密码" type="password"/>
                <button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary" type="button" onclick="togglePassword()">
                  <span id="eyeIcon" class="material-symbols-outlined">visibility</span>
                </button>
              </div>
            </div>
          </div>

          <div class="flex items-center justify-between font-label-sm text-label-sm">
            <label class="flex items-center space-x-2 cursor-pointer group">
              <input class="w-5 h-5 rounded-lg border-outline-variant text-primary focus:ring-primary/20 transition-all" type="checkbox" id="remember"/>
              <span class="text-on-surface-variant group-hover:text-primary">记住登录</span>
            </label>
            <a class="text-primary hover:underline font-semibold" href="forgot-password.html">忘记密码？</a>
          </div>

          <button id="loginBtn" class="w-full h-[64px] bg-primary text-on-primary font-headline-md text-headline-md rounded-full shadow-[0_8px_24px_-4px_rgba(134,78,90,0.4)] hover:shadow-[0_12px_32px_-4px_rgba(134,78,90,0.6)] active:scale-95 transition-all duration-300 flex items-center justify-center space-x-2" type="submit">
            <span id="loginBtnText">开启我的财务花园</span>
            <span id="loginSpinner" class="hidden material-symbols-outlined animate-spin">progress_activity</span>
          </button>
        </form>

        <div class="relative flex items-center py-2">
          <div class="flex-grow border-t border-outline-variant"></div>
          <span class="flex-shrink mx-4 font-label-sm text-label-sm text-outline">其他登录方式</span>

          </button>

            <img alt="Alipay" class="w-7 h-7 grayscale group-hover:grayscale-0 transition-all opacity-70 group-hover:opacity-100" src="https://lh3.googleusercontent.com/aida-public/AB6AXuADk5U6PKFrGpm2ANvQXc_oIu0BW3jaCi4bfaz0b5dRmcQHRrldgeSaeXHc2z3f0l6OMojXN1ozvVxY2L-g9gv3V1BqZb75mmFp3-fayGE6mvk6ZspvhqqwgUwRQLgCH5mTVVUy5d5-m-eoWfEoj1K14Sj2LNo9Qkco6Z0o5ltnZUlXZUCxNjhh9i5fiA9bYz0jirNBmVgvt6Lrk7Fut9zsbB5eJZbaX3KKNtQYxX7qRkF2YhQCYGuMTtShYM_TLVoj2RJ_2-kl-uud"/>
          </button>
        </div>

        <div class="text-center">
          <p class="font-body-md text-on-surface-variant">
            还没有账号？ <a class="text-primary font-semibold hover:underline" href="register.html">立即注册</a>

<div class="fixed bottom-0 left-0 w-full h-24 overflow-hidden pointer-events-none flex justify-around items-end opacity-20">
  <span class="material-symbols-outlined text-[64px] text-primary" style="font-variation-settings: 'FILL' 1;">local_florist</span>
  <span class="material-symbols-outlined text-[48px] text-tertiary" style="font-variation-settings: 'FILL' 1;">spa</span>
  <span class="material-symbols-outlined text-[80px] text-primary-container" style="font-variation-settings: 'FILL' 1;">yard</span>
  <span class="material-symbols-outlined text-[40px] text-tertiary-container" style="font-variation-settings: 'FILL' 1;">filter_vintage</span>
</div>

<script>
const API_BASE = 'http://localhost:8080/api/v1';

function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast ' + type + ' show';
  setTimeout(() => { toast.classList.remove('show'); }, 3000);
}

function togglePassword() {
  const pwd = document.getElementById('password');
  const icon = document.getElementById('eyeIcon');
  if (pwd.type === 'password') {
    pwd.type = 'text';
    icon.textContent = 'visibility_off';
  } else {
    pwd.type = 'password';
    icon.textContent = 'visibility';
  }
}

function setLoading(loading) {
  const btn = document.getElementById('loginBtn');
  const btnText = document.getElementById('loginBtnText');
  const spinner = document.getElementById('loginSpinner');
  if (loading) {
    btn.disabled = true;
    btnText.classList.add('hidden');
    spinner.classList.remove('hidden');
  } else {
    btn.disabled = false;
    btnText.classList.remove('hidden');
    spinner.classList.add('hidden');
  }
}

// Check for remembered credentials on page load
(function() {
  try {
    var savedUsername = localStorage.getItem('bloom_remembered_username');
    var savedPassword = localStorage.getItem('bloom_remembered_password');
    if (savedUsername) {
      document.getElementById('login-id').value = savedUsername;
    }
    if (savedPassword) {
      document.getElementById('password').value = savedPassword;
    }
    if (savedUsername && savedPassword) {
      document.getElementById('remember').checked = true;
    }
  } catch (e) {
    console.error('Remember me error:', e);
  }
})();

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const username = document.getElementById('login-id').value.trim();
  const password = document.getElementById('password').value;
  const remember = document.getElementById('remember').checked;

  if (!username) {
    showToast('请输入用户名、邮箱或手机号', 'error');
    return;
  }
  if (!password) {
    showToast('请输入登录密码', 'error');
    return;
  }

  setLoading(true);

  try {
    const response = await fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const result = await response.json();

    if (result.code === 200) {
      // 分离AccessToken和RefreshToken
      const tokens = result.data.split('|');
      const accessToken = tokens[0];
      const refreshToken = tokens[1];

      // 存储Token
      localStorage.setItem('access_token', accessToken);
      localStorage.setItem('refresh_token', refreshToken);

      // Handle remember me functionality
      if (remember) {
        localStorage.setItem('bloom_remembered_username', username);
        localStorage.setItem('bloom_remembered_password', password);
      } else {
        localStorage.removeItem('bloom_remembered_username');
        localStorage.removeItem('bloom_remembered_password');
      }

      showToast('登录成功，即将跳转...', 'success');

      // 跳转到首页
      setTimeout(() => {
        window.location.href = '../../app.html';
      }, 1000);
    } else {
      showToast(result.message || '登录失败，请检查用户名和密码', 'error');
    }
  } catch (error) {
    console.error('Login error:', error);
    showToast('网络错误，请检查服务器是否启动', 'error');
  } finally {
    setLoading(false);
  }
});
</script>
</body>
