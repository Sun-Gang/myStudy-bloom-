            "primary-fixed": "#ffd9df", "surface-tint": "#864e5a",

          },
          "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },

          "fontSize": { "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }], "display-lg-mobile": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }] }
        }
      }
    };
  </script>
  <style>
    body { background-color: #fff8f8; font-family: 'Be Vietnam Pro', sans-serif; }
    .soft-glow { box-shadow: 0 20px 40px rgba(240, 208, 216, 0.4); }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .bg-cherry-gradient { background: linear-gradient(135deg, #fff8f8 0%, #fee8f0 100%); }
    .chart-bar { transition: height 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .loading-skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
  </style>
</head>

<body class="bg-background text-on-surface font-body-md antialiased">
  <!-- Sidebar Navigation (iframe) -->
  <iframe id="sidebar-iframe" src="components/sidebar.html" class="fixed left-0 top-0 h-screen w-[288px] z-40" frameborder="0" scrolling="no"></iframe>

  <!-- Main Content Area -->
  <main class="md:ml-[288px] min-h-screen bg-cherry-gradient pb-32 md:pb-container-padding">
    <!-- Header (iframe) -->
    <iframe id="header-iframe" src="components/header.html?v=9" class="sticky top-0 z-40 w-full h-[72px]" frameborder="0" scrolling="no"></iframe>

    <!-- Dynamic Content Container -->
    <div id="content-area" class="p-6"></div>
  </main>

  <script>
    var API_BASE = 'http://localhost:8080/api/v1';

    // ========== API Service Layer ==========
    function getToken() { return localStorage.getItem('access_token'); }
    function getRefreshToken() { return localStorage.getItem('refresh_token'); }

    async function apiGet(path) {
      var token = getToken();
      if (!token) throw new Error('NOT_AUTHENTICATED');
      var res = await fetch(API_BASE + path, {
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
      });
      if (res.status === 401) {
        // Try refresh
        var refreshed = await tryRefresh();
        if (refreshed) {
          token = getToken();
          res = await fetch(API_BASE + path, {
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
          });
        }
      }
      if (!res.ok) throw new Error('API_ERROR_' + res.status);
      var json = await res.json();
      if (json.code !== 200 && json.code !== 201) throw new Error(json.message || 'API_ERROR');
      return json.data;
    }

    async function apiPost(path, body) {
      var token = getToken();
      if (!token) throw new Error('NOT_AUTHENTICATED');
      var res = await fetch(API_BASE + path, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (res.status === 401) {
        var refreshed = await tryRefresh();
        if (refreshed) {
          token = getToken();
          res = await fetch(API_BASE + path, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
        }
      }
      if (!res.ok) throw new Error('API_ERROR_' + res.status);
      var json = await res.json();
      if (json.code !== 200 && json.code !== 201) throw new Error(json.message || 'API_ERROR');
      return json.data;
    }

    async function apiPut(path, body) {
      var token = getToken();
      if (!token) throw new Error('NOT_AUTHENTICATED');
      var res = await fetch(API_BASE + path, {
        method: 'PUT',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (res.status === 401) {
        var refreshed = await tryRefresh();
        if (refreshed) {
          token = getToken();
          res = await fetch(API_BASE + path, {
            method: 'PUT',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
        }
      }
      if (!res.ok) throw new Error('API_ERROR_' + res.status);
      var json = await res.json();
      if (json.code !== 200 && json.code !== 201) throw new Error(json.message || 'API_ERROR');
      return json.data;
    }

    async function tryRefresh() {
      var refreshToken = getRefreshToken();
      if (!refreshToken) return false;
      try {
        var res = await fetch(API_BASE + '/auth/refresh-token', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + refreshToken }
        });
        if (res.ok) {
          var json = await res.json();
          if (json.code === 200) {
            localStorage.setItem('access_token', json.data);
            return true;
          }
        }
      } catch (e) { /* silent fail */ }
      return false;
    }

    // ========== Utilities ==========
    function formatCurrency(value) {
      if (value === null || value === undefined) return '¥0.00';
      return '¥' + parseFloat(value).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function formatPercent(value) {
      if (value === null || value === undefined) return '0%';
      return parseFloat(value).toFixed(1) + '%';
    }

    // Global bookkeeping filter state
    var _bkSearchText = '', _bkStartDate = null, _bkEndDate = null, _bkCategoryId = null, _bkOrigData = null;

    function showError(msg) {
      var el = document.createElement('div');
      el.className = 'text-center py-8 text-red-500';
      el.textContent = msg;
      document.getElementById('content-area').innerHTML = '';
      document.getElementById('content-area').appendChild(el);
    }

    // ========== Page Renderers ==========
    // Each renderer: (1) show skeleton, (2) fetch data, (3) call renderFn with data
    var pageRenderers = {
      'home.html': async function() {
        var data = await apiGet('/dashboard');
        renderHome(data);
      },
      'accounts.html': async function() {
        var data = await apiGet('/accounts/summary');
        renderAccounts(data);
      },
      'bookkeeping.html': async function() {
        var data = await apiGet('/transactions/summary');
        renderBookkeeping(data);
      },
      'analysis.html': async function() {
        var data = await apiGet('/assets/allocation');
        renderAnalysis(data);
      },
      'goals.html': async function() {
        var data = await apiGet('/goals');
        renderGoals(data);
      }
    };

    // ========== Dashboard Renderer ==========
    function renderHome(data) {
      var el = document.getElementById('totalNetWorth');
      if (el) el.textContent = formatCurrency(data.totalNetWorth);
      var el2 = document.getElementById('growthRate');
      if (el2) el2.textContent = '本月增长 ' + formatPercent(data.monthGrowthRate);
      var el3 = document.getElementById('healthScore');
      if (el3) el3.textContent = data.healthScore || 0;
      var el4 = document.getElementById('healthDescription');
      if (el4) el4.textContent = data.healthDescription || '';
      var el5 = document.getElementById('healthCircle');
      if (el5) {
        var circumference = 2 * Math.PI * 58;
        el5.style.strokeDashoffset = circumference * (1 - (data.healthScore || 0) / 100);
      }
      var el6 = document.getElementById('monthIncome');
      if (el6) el6.textContent = formatCurrency(data.monthIncome);
      var el7 = document.getElementById('monthExpense');
      if (el7) el7.textContent = formatCurrency(data.monthExpense);
      var el8 = document.getElementById('incomeCount');
      if (el8) el8.textContent = (data.incomeCount || 0) + ' 笔交易';
      var el9 = document.getElementById('expenseCount');
      if (el9) el9.textContent = (data.expenseCount || 0) + ' 笔交易';

      // Budget alerts
      if (data.budgetAlerts && data.budgetAlerts.length > 0) {
        var budget = data.budgetAlerts[0];
        var bn = document.getElementById('budgetCategoryName');
        if (bn) bn.textContent = budget.categoryName || '预算提醒';
        var bp = document.getElementById('budgetProgressBar');
        if (bp) bp.style.width = Math.min(budget.usedPercent, 100) + '%';
        var bd = document.getElementById('budgetDescription');
        if (bd) bd.textContent = '已使用每月 ' + formatCurrency(budget.budgetAmount) + ' 限额的 ' + budget.usedPercent + '%';
      }

      // Bill reminders
      var billList = document.getElementById('billRemindersList');
      if (billList) {
        billList.innerHTML = '';
        if (data.billReminders && data.billReminders.length > 0) {
          data.billReminders.forEach(function(bill) {
            var icon = bill.icon || 'bolt';
            var borderColor = bill.daysUntilDue <= 2 ? 'border-primary' : bill.daysUntilDue <= 5 ? 'border-tertiary-container' : 'border-secondary-container';
            var billItem = document.createElement('div');
            billItem.className = 'flex items-center gap-4 p-4 rounded-[24px] bg-surface-container-low border-l-4 ' + borderColor;
            billItem.innerHTML = '<div class="w-12 h-12 bg-white rounded-full flex items-center justify-center text-primary"><span class="material-symbols-outlined">' + icon + '</span></div><div><p class="font-body-md font-bold">' + bill.billName + '</p><p class="text-on-surface-variant font-label-sm">' + (bill.daysUntilDue > 0 ? bill.daysUntilDue + ' 天后到期' : '已逾期') + ' • ' + formatCurrency(bill.amount) + '</p></div>';
            billList.appendChild(billItem);
          });
        } else {
          billList.innerHTML = '<p class="text-on-surface-variant col-span-3 text-center py-8">暂无待还账单</p>';
        }
      }

      // Mini chart
      if (data.netWorthTrend && data.netWorthTrend.length > 0) {
        var bars = document.querySelectorAll('#miniChart .chart-bar');
        var values = data.netWorthTrend.map(function(t) { return parseFloat(t.netWorth) || 0; });
        var maxValue = Math.max.apply(null, values);
        var minValue = Math.min.apply(null, values);
        var range = maxValue - minValue || 1;
        bars.forEach(function(bar, index) {
          if (values[index] !== undefined) {
            var heightPercent = ((values[index] - minValue) / range * 50) + 40;
            bar.style.height = heightPercent + '%';
          }
        });
      }
    }

    // ========== Accounts Renderer ==========
    function renderAccounts(data) {
      window._accountsData = data; // Store for card detail modals
      var loading = document.getElementById('loading-state');
      if (loading) loading.style.display = 'none';
      var totalCard = document.getElementById('total-balance-card');
      if (totalCard) totalCard.classList.remove('hidden');
      var summaryBubble = document.getElementById('summary-bubble');
      if (summaryBubble) summaryBubble.classList.remove('hidden');

      var el = document.getElementById('total-net-worth');
      if (el) el.textContent = formatCurrency(data.totalNetWorth);
      var healthEl = document.getElementById('health-status');
      if (healthEl && data.healthStatus) healthEl.textContent = data.healthStatus;
      var growthEl = document.getElementById('growth-text');
      if (growthEl) growthEl.textContent = '本月净资产增长 ' + formatPercent(data.monthlyGrowthRate) + '。';

      if (data.bankCardSummary) {
        var bcBalance = document.getElementById('bank-card-balance');
        if (bcBalance) bcBalance.textContent = formatCurrency(data.bankCardSummary.balance);
        var bcCount = document.getElementById('bank-card-count');
        if (bcCount) bcCount.textContent = (data.bankCardSummary.count || 0) + ' 活跃';
        var bcCard = document.getElementById('bank-card');
        if (bcCard) bcCard.classList.remove('hidden');
      }
      if (data.investmentSummary) {
        var invBalance = document.getElementById('investment-balance');
        if (invBalance) invBalance.textContent = formatCurrency(data.investmentSummary.balance);
        var invRate = document.getElementById('investment-rate');
        if (invRate) invRate.textContent = '+' + formatPercent(data.investmentSummary.percentage);
        var invCard = document.getElementById('investment-card');
        if (invCard) invCard.classList.remove('hidden');
      }
      if (data.socialSecuritySummary) {
        var ssBalance = document.getElementById('social-security-balance');
        if (ssBalance) ssBalance.textContent = formatCurrency(data.socialSecuritySummary.balance);
        var ssDate = document.getElementById('social-security-date');
        if (ssDate && data.socialSecuritySummary.lastPaymentDate) ssDate.textContent = '最近缴存: ' + data.socialSecuritySummary.lastPaymentDate;
        var ssCard = document.getElementById('social-security-card');
        if (ssCard) ssCard.classList.remove('hidden');
      }
      if (data.liabilitySummary) {
        var liabAmount = document.getElementById('liability-amount');
        if (liabAmount) liabAmount.textContent = '-' + formatCurrency(data.liabilitySummary.totalAmount);
        var liabCard = document.getElementById('liability-card');
        if (liabCard) liabCard.classList.remove('hidden');
      }
      if (data.fixedAssetSummary) {
        var faAmount = document.getElementById('fixed-asset-amount');
        if (faAmount) faAmount.textContent = formatCurrency(data.fixedAssetSummary.totalAmount);
        var propCount = document.getElementById('property-count');
        if (propCount) propCount.textContent = '房产 (' + (data.fixedAssetSummary.propertyCount || 0) + ')';
        var vehCount = document.getElementById('vehicle-count');
        if (vehCount) vehCount.textContent = '汽车 (' + (data.fixedAssetSummary.vehicleCount || 0) + ')';
        var faCard = document.getElementById('fixed-asset-card');
        if (faCard) faCard.classList.remove('hidden');
      }
    }

    // ========== Bookkeeping Renderer ==========
    function renderBookkeeping(data) {
      var loading = document.getElementById('loading-state');
      if (loading) loading.style.display = 'none';
      var summarySection = document.getElementById('summary-section');
      if (summarySection) summarySection.classList.remove('hidden');
      var filterSection = document.getElementById('filter-section');
      if (filterSection) filterSection.classList.remove('hidden');
      var txSection = document.getElementById('transaction-section');
      if (txSection) txSection.classList.remove('hidden');

      // Store original data for filtering
      _bkOrigData = data.transactions ? JSON.parse(JSON.stringify(data.transactions)) : [];
      _bkSearchText = '';
      _bkStartDate = null;
      _bkEndDate = null;
      _bkCategoryId = null;

      var el = document.getElementById('monthly-expense');
      if (el) el.textContent = '-' + formatCurrency(data.monthlyExpense);
      var el2 = document.getElementById('monthly-income');
      if (el2) el2.textContent = '+' + formatCurrency(data.monthlyIncome);
      var el3 = document.getElementById('daily-average');
      if (el3) el3.textContent = formatCurrency(data.dailyAverageExpense);
      var el4 = document.getElementById('budget-status');
      if (el4 && data.budgetStatus) el4.textContent = data.budgetStatus;
      var el5 = document.getElementById('month-title');
      if (el5 && data.monthInfo) el5.textContent = data.monthInfo;
      var reimbAmt = document.getElementById('reimbursable-amount');
      if (reimbAmt) reimbAmt.textContent = formatCurrency(data.reimbursableAmount);
      var reimbCount = document.getElementById('reimbursable-count');
      if (reimbCount) reimbCount.textContent = data.reimbursableCount || 0;

      var txListEl = document.getElementById('transaction-list');
      if (txListEl && data.transactions) {
        txListEl.innerHTML = '';
        data.transactions.forEach(function(dayTx) {
          dayTx.transactions.forEach(function(tx) {
            var item = document.createElement('div');
            item.className = 'flex items-center gap-4 p-4 bg-white rounded-2xl';
            var typeColor = tx.transactionType === 1 ? 'text-tertiary' : 'text-error';
            var typeIcon = tx.transactionType === 1 ? 'arrow_downward' : 'arrow_upward';
            item.innerHTML = '<div class="w-10 h-10 bg-surface-container rounded-full flex items-center justify-center ' + typeColor + '"><span class="material-symbols-outlined">' + typeIcon + '</span></div><div class="flex-1"><p class="font-body-md font-bold">' + (tx.categoryName || tx.merchantName || '未知') + '</p><p class="text-on-surface-variant font-label-sm">' + (tx.description || '') + '</p></div><div class="text-right"><p class="font-body-md font-bold ' + typeColor + '">' + (tx.transactionType === 1 ? '+' : '-') + formatCurrency(tx.amount) + '</p></div>';
            txListEl.appendChild(item);
          });
        });
        if (txListEl.children.length === 0) txListEl.innerHTML = '<p class="text-on-surface-variant text-center py-8 col-span-3">暂无交易记录</p>';
      }
    }

    // ========== Analysis Renderer ==========
    function renderAnalysis(data) {
      var chartEl = document.getElementById('allocation-chart');
      if (chartEl && data.allocationList) {
        chartEl.innerHTML = '';
        data.allocationList.forEach(function(item) {
          var row = document.createElement('div');
          row.className = 'flex items-center gap-4 p-4 bg-white rounded-2xl';
          row.innerHTML = '<div class="w-12 h-12 bg-primary-container rounded-full flex items-center justify-center text-primary"><span class="material-symbols-outlined">account_balance</span></div><div class="flex-1"><p class="font-body-md font-bold">' + item.typeName + '</p><p class="text-on-surface-variant font-label-sm">占比 ' + item.percentage + '%</p></div><div class="text-right"><p class="font-body-md font-bold">' + formatCurrency(item.amount) + '</p></div>';
          chartEl.appendChild(row);
        });
        if (chartEl.children.length === 0) chartEl.innerHTML = '<p class="text-on-surface-variant text-center py-8">暂无资产数据</p>';
      }
      var totalEl = document.getElementById('total-asset-value');
      if (totalEl) totalEl.textContent = formatCurrency(data.totalAsset);
    }

    // ========== Goals Renderer ==========
    function renderGoals(data) {
      var gridEl = document.getElementById('goals-grid');
      // API returns { records: [] } or { data: { records: [] } }
      var goals = data.records || data.data || data.items || [];

      // Update summary header with real data
      var summaryProgress = 0;
      var tipText = '暂无理财目标';
      if (Array.isArray(goals) && goals.length > 0) {
        var totalProgress = 0;
        var validCount = 0;
        goals.forEach(function(goal) {
          if (goal.progress !== undefined && goal.progress !== null) {
            totalProgress += parseFloat(goal.progress);
            validCount++;
          }
        });
        if (validCount > 0) {
          summaryProgress = totalProgress / validCount;
        }
        if (summaryProgress >= 80) {
          tipText = '太棒了！目标达成率非常高';
        } else if (summaryProgress >= 50) {
          tipText = '继续保持！您的目标进展顺利';
        } else if (summaryProgress >= 25) {
          tipText = '稳扎稳打！您的目标正在逐步实现';
        } else {
          tipText = '开始行动！每一步都离目标更近';
        }
      }

      // Update progress circle and percentage (cap display at 100%)
      var svgCircle = document.querySelector('.goals-summary svg circle:nth-child(2)');
      if (svgCircle && summaryProgress >= 0) {
        var circumference = 351.8;
        var dashoffset = circumference * (1 - Math.min(summaryProgress, 100) / 100);
        svgCircle.setAttribute('stroke-dashoffset', dashoffset.toFixed(1));
      }
      var percentEl = document.querySelector('.goals-summary .absolute span:first-child');
      if (percentEl) percentEl.textContent = Math.min(summaryProgress, 9999).toFixed(0) + '%';

      // Update tip text
      var tipEl = document.querySelector('.goals-summary + div h3');
      if (tipEl) tipEl.textContent = tipText;

      // Update description paragraph with real data
      var descEl = document.querySelector('.goals-summary + div p');
      if (descEl && Array.isArray(goals) && goals.length > 0) {
        var totalSaved = 0;
        var goalCount = goals.length;
        var earliestGoal = null;
        goals.forEach(function(goal) {
          totalSaved += parseFloat(goal.currentAmount || 0);
          if (!earliestGoal || (goal.createdAt && new Date(goal.createdAt) < new Date(earliestGoal.createdAt))) {
            earliestGoal = goal;
          }
        });
        var daysCount = 0;
        if (earliestGoal && earliestGoal.createdAt) {
          var now = new Date();
          var created = new Date(earliestGoal.createdAt);
          daysCount = Math.floor((now - created) / (1000 * 60 * 60 * 24));
        }
        var topGoal = goals[0].goalName || '目标';
        var savedDisplay = totalSaved >= 10000 ? (totalSaved / 10000).toFixed(1) + '万' : totalSaved.toFixed(0);
        descEl.textContent = '您已为' + topGoal + '储蓄了 ¥' + savedDisplay + '。共有 ' + goalCount + ' 个目标在进行中。' + (daysCount > 0 ? '已坚持 ' + daysCount + ' 天。' : '');
      } else if (descEl) {
        descEl.textContent = '暂无理财目标，立即开始创建您的第一个目标吧！';
      }

      // Update "理财达人" streak section

      // Filter by date preset
      function filterByDatePreset(preset) {
        var today = new Date();
        var y = today.getFullYear(), m = today.getMonth(), d = today.getDate();
        var dayOfWeek = today.getDay();
        var start, end;
        var dateStr = function(year, month, day) {
          return year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
        };
        if (preset === 'today') {
          start = end = dateStr(y, m, d);
        } else if (preset === 'yesterday') {
          var yesterday = new Date(y, m, d-1);
          start = end = dateStr(yesterday.getFullYear(), yesterday.getMonth(), yesterday.getDate());
        } else if (preset === 'thisWeek') {
          var sunday = new Date(y, m, d - dayOfWeek);
          start = dateStr(sunday.getFullYear(), sunday.getMonth(), sunday.getDate());
          end = dateStr(y, m, d);
        } else if (preset === 'thisMonth') {
          start = dateStr(y, m, 1);
          end = dateStr(y, m, d);
        } else if (preset === 'lastMonth') {
          var lm = new Date(y, m-1, 1);
          var daysInLM = new Date(lm.getFullYear(), lm.getMonth()+1, 0).getDate();
          start = dateStr(lm.getFullYear(), lm.getMonth(), 1);
          end = dateStr(lm.getFullYear(), lm.getMonth(), daysInLM);
        }
        _bkStartDate = start;
        _bkEndDate = end;
        // Remove only filter modals (z-50), not sidebar or FAB
        document.querySelectorAll('.fixed.z-50').forEach(function(el) { el.remove(); });
        applyBkFilters();
      }

      // Filter by category
      function filterByCategory(catId) {
        _bkCategoryId = catId;
        // Remove only filter modals (z-50), not sidebar or FAB
        document.querySelectorAll('.fixed.z-50').forEach(function(el) { el.remove(); });
        applyBkFilters();
      }

      // Apply bookkeeping filters
    function applyBkFilters() {
      var txList = document.getElementById('transaction-list');
      if (!txList || !_bkOrigData) return;
      if (_bkOrigData.length === 0) { txList.innerHTML = '<div class="text-center py-12 text-on-surface-variant">暂无交易记录</div>'; return; }
      var filtered = JSON.parse(JSON.stringify(_bkOrigData));
      // date filter
      if (_bkStartDate && _bkEndDate) {
        filtered = filtered.map(function(d) {
          var filteredTx = d.transactions.filter(function(t) {
            var dStr = t.transactionDate ? t.transactionDate.split(' ')[0] : '';
            return dStr >= _bkStartDate && dStr <= _bkEndDate;
          });
          return { dateTitle: d.dateTitle, transactions: filteredTx };
        }).filter(function(d) { return d.transactions.length > 0; });
      }
      // category filter
      if (_bkCategoryId !== null) {
        var catNames = {1:'工资',2:'奖金',3:'投资收入',4:'副业',5:'理财收益',10:'餐饮',11:'早午晚餐',12:'外卖',13:'下午茶',20:'居住',21:'房租/房贷',22:'水电气',23:'物业费',30:'交通',31:'公共交通',32:'打车',33:'私家车',40:'购物',50:'医疗',60:'教育',70:'娱乐',80:'旅游',90:'社交',100:'投资'};
        var catName = catNames[_bkCategoryId] || '';
        filtered = filtered.map(function(d) {
          var filteredTx = d.transactions.filter(function(t) { return t.categoryId === _bkCategoryId || (catName && t.categoryName === catName); });
          return { dateTitle: d.dateTitle, transactions: filteredTx };
        }).filter(function(d) { return d.transactions.length > 0; });
      }
      // search filter
      if (_bkSearchText) {
        var txt = _bkSearchText.toLowerCase();
        filtered = filtered.map(function(d) {
          var filteredTx = d.transactions.filter(function(t) {
            return (t.merchantName||'').toLowerCase().includes(txt) || (t.description||'').toLowerCase().includes(txt) || (t.categoryName||'').toLowerCase().includes(txt) || (t.accountName||'').toLowerCase().includes(txt);
          });
          return { dateTitle: d.dateTitle, transactions: filteredTx };
        }).filter(function(d) { return d.transactions.length > 0; });
      }
      txList.innerHTML = '';
      if (filtered.length === 0 || filtered.every(function(d) { return d.transactions.length === 0; })) {
        txList.innerHTML = '<div class="text-center py-12 text-on-surface-variant">没有匹配的交易记录</div>';
        return;

      filtered.forEach(function(daily) {

          txList.appendChild(item);

      });

    async function loadPage(pageName) {
      showSkeleton();
      try {
        // Step 1: Load HTML template
        var response = await fetch('pages/' + pageName);
        var html = await response.text();
        var temp = document.createElement('div');
        temp.innerHTML = html;

        // Get main content and remove iframes/scripts
        var mainContent = temp.querySelector('main');
        if (mainContent) {
          var iframes = mainContent.querySelectorAll('iframe');
          iframes.forEach(function(iframe) { iframe.remove(); });
          var scripts = mainContent.querySelectorAll('script');
          scripts.forEach(function(s) { s.remove(); });
        }

        // Collect content AFTER </main> (floating buttons, modals, etc.)
        var afterMain = '';
        var allContent = temp.innerHTML;
        var mainCloseIndex = allContent.indexOf('</main>');
        if (mainCloseIndex !== -1) {
          afterMain = allContent.substring(mainCloseIndex + 7).replace(/<\/body>|<\/html>/gi, '');
        }

        // Inject content
        document.getElementById('content-area').innerHTML = (mainContent ? mainContent.innerHTML : '') + afterMain;

        // Step 2: Re-attach button handlers (after content injection, before renderer)
        attachButtonHandlers();

        // Step 3: Call renderer to fetch data and populate DOM
        var renderer = pageRenderers[pageName];
        if (renderer) {
          await renderer();
        }
        history.pushState({ page: pageName }, '', '#' + pageName);
        // Only set hash if not already correctly set (prevents double-load on init)
        var currentHash = window.top.location.hash;
        var expectedHash = '#' + pageName;
        if (currentHash !== expectedHash) {
          window.top.location.hash = pageName;
        } else {
          // Hash is already correct, but still need history state
          history.pushState({ page: pageName }, '', expectedHash);
        }
      } catch (error) {
        console.error('Load error:', error);
        if (error.message === 'NOT_AUTHENTICATED' || error.message.indexOf('401') !== -1) {
          localStorage.removeItem('access_token');
          localStorage.removeItem('refresh_token');
          document.getElementById('content-area').innerHTML = '<div class="flex flex-col items-center justify-center min-h-[60vh] text-center px-6"><div class="w-20 h-20 bg-primary-container rounded-full flex items-center justify-center mb-6"><span class="material-symbols-outlined text-[40px] text-primary">account_circle</span></div><h2 class="font-headline-md text-headline-md text-on-surface mb-2">登录已过期</h2><p class="text-on-surface-variant mb-6">请重新登录</p><a href="pages/auth/login.html" class="px-8 py-3 bg-primary text-on-primary rounded-full font-headline-md hover:shadow-lg transition-all">前往登录</a></div>';
        } else {
          showError('加载失败: ' + error.message);
        }
      }
    }

    // ========== Router ==========
    window.addEventListener('hashchange', function() {
      var page = window.location.hash.replace('#', '') || 'home.html';
      loadPage(page);
    });

    window.addEventListener('popstate', function(e) {
      if (e.state && e.state.page) loadPage(e.state.page);
    });

    // Initial load
    loadPage('home.html');
  </script>
